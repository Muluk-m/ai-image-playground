<div class="picker">
  <h1>Admin「提示词」页原型（方案 2）</h1>
  <p class="lead">示例数据。一行是一条 chat 拟出的生成提示词，含用户未确认的草稿；确认前被用户改过的部分高亮显示。</p>

<div class="frame" id="frame"></div>
<p class="note">紫色虚线框标出的是新增部分。“原稿 → 提交稿”的差异来自 <span class="mono">agent_generation_drafts.drafted_prompt</span> 与任务里的实际 prompt。</p>

<script>
const SWATCH = ['#c9d6a3','#e7c6a5','#a9c4d8','#d9b3c7','#b8b0d9','#cfd9b0','#e3d3a0','#a8d5c2'];
const sw = (i) => `background:linear-gradient(135deg, ${SWATCH[i % 8]}, ${SWATCH[(i + 3) % 8]})`;

const TURNS = [
  { id: 't_8f2a', conv: 'c_31d0', title: '夏季防晒衣主图', user: 'linmo@***.com', tier: 'Plus', at: '10-17 14:32', model: 'gpt-6-luna', tok: '18.2k / 1.4k', cache: '71%', dur: '9.8s',

    calls: [{ tool: 'generate_image', target: 'gpt-image-2', n: 4, size: '1:1 · 2048', state: 'ok', draft: true,

      task: 'tk_9a71e2', imgs: 4 }] },
  { id: 't_8f19', conv: 'c_31d0', title: '夏季防晒衣主图', user: 'linmo@***.com', tier: 'Plus', at: '10-17 14:28', model: 'gpt-6-luna', tok: '12.6k / 0.6k', cache: '64%', dur: '4.1s',
    said: '这件衣服的面料卖点是什么比较好',
    reply: '从吊牌看是 UPF50+、冰丝凉感、可收纳。主图建议突出“UPF50+”和“凉感”，收纳适合放在副图。',
    calls: [] },
  { id: 't_7c03', conv: 'c_2e88', title: '咖啡豆详情页', user: 'device:7f3c…a1', tier: '未登录', at: '10-17 13:55', model: 'gpt-6-luna', tok: '22.9k / 2.1k', cache: '58%', dur: '15.3s',
    said: '参考第 2 张图的风格，给咖啡豆包装做 3 张详情页场景图',
    reply: '我拆成了 3 个场景：晨光木桌、手冲过程、豆子特写。第 3 张上游失败了，可以点重试。',
    calls: [
      { tool: 'generate_image', target: 'gemini-3.1-flash-image', n: 1, size: '3:4', state: 'ok', ref: 'image 2',
        final: 'Kraft paper coffee bean bag on a rustic oak table, morning sunlight through window, steam from a ceramic cup, warm film tone matching reference image 2, editorial product photography', task: 'tk_77c0a1', imgs: 1 },
      { tool: 'generate_image', target: 'gemini-3.1-flash-image', n: 1, size: '3:4', state: 'ok', ref: 'image 2',
        final: 'Pour-over coffee in progress beside the kraft coffee bag, gooseneck kettle, close-up hands, warm film tone matching reference image 2', task: 'tk_77c0a2', imgs: 1 },
      { tool: 'generate_image', target: 'gemini-3.1-flash-image', n: 1, size: '3:4', state: 'fail', ref: 'image 2',
        final: 'Macro shot of roasted coffee beans spilling from the bag, shallow depth of field, warm film tone matching reference image 2', task: 'tk_77c0a3', imgs: 0, err: 'upstream 429 · rate limited' },
    ] },
  { id: 't_6b51', conv: 'c_2a10', title: '口红短视频', user: 'qy***@gmail.com', tier: 'Max', at: '10-17 11:07', model: 'gpt-6-astra', tok: '31.4k / 1.9k', cache: '82%', dur: '7.2s',
    said: '用这张口红图做个 5 秒的短视频，镜头慢慢推近',
    reply: '拟好了视频提示词，等你确认后提交，预计 1–2 分钟。',
    calls: [{ tool: 'generate_video', target: 'doubao-seedance-2-0-mini', n: 1, size: '9:16 · 5s', state: 'wait', draft: true,
      orig: 'Slow dolly-in on a matte red lipstick standing on a marble surface, soft pink backdrop, subtle light sweep across the metallic case, luxury cosmetic ad, 5 seconds',
      final: null, task: null, imgs: 0 }] },
  { id: 't_5e2d', conv: 'c_1f77', title: '宠物粮 banner', user: 'ops@***.cn', tier: 'Basic', at: '10-17 09:41', model: 'gpt-6-luna', tok: '9.8k / 0.9k', cache: '40%', dur: '22.6s',
    said: '把 banner 里的狗换成柯基，背景不变',
    reply: '我圈了狗的区域做局部重绘，背景保持不动。',
    calls: [{ tool: 'edit_image', target: 'gpt-image-2', n: 2, size: '16:9', state: 'run', mask: true,
      final: 'Replace the dog in the masked area with a happy Welsh Corgi sitting, same lighting and perspective, keep background untouched', task: 'tk_5e2d90', imgs: 0 }] },
];

const STATE = { ok: ['已出图', 's-ok'], fail: ['失败', 's-fail'], wait: ['待确认', 's-wait'], run: ['生成中', 's-run'] };
const badge = (s) => `<span class="badge ${STATE[s][1]}">${STATE[s][0]}</span>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function diff(a, b) {
  const A = a.split(' '), B = b.split(' ');
  const dp = Array.from({ length: A.length + 1 }, () => new Array(B.length + 1).fill(0));
  for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < A.length && j < B.length) {
    if (A[i] === B[j]) { out.push(esc(A[i])); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(`<del>${esc(A[i++])}</del>`);
    else out.push(`<ins>${esc(B[j++])}</ins>`);
  }
  while (i < A.length) out.push(`<del>${esc(A[i++])}</del>`);
  while (j < B.length) out.push(`<ins>${esc(B[j++])}</ins>`);
  return out.join(' ');
}

function promptBlock(c) {
  const edited = c.orig && c.final && c.orig !== c.final;
  let body;
  if (edited) body = `<div class="prompt diff">${diff(c.orig, c.final)}</div><div class="muted" style="font-size:11px">用户确认前改过：<del style="background:var(--del)">删</del> <ins style="background:var(--ins);text-decoration:none">增</ins>，相对 chat 原稿</div>`;
  else body = `<div class="prompt">${esc(c.final || c.orig)}</div>`;
  return body;
}

function toolCard(c, i) {
  return `<div class="tool">
    <div class="th"><span><span class="mono">${c.tool}</span> · ${c.target}</span><span style="display:flex;gap:6px;align-items:center">${badge(c.state)}<button class="copy" type="button">复制提示词</button></span></div>
    <div class="tb">
      ${promptBlock(c)}
      <dl class="kv">
        <dt>参数</dt><dd>${c.n} 张 · ${c.size}${c.ref ? ` · 参考 ${c.ref}` : ''}${c.mask ? ' · 带遮罩' : ''}</dd>
        <dt>任务</dt><dd>${c.task ? `<span class="mono">${c.task}</span>` : '<span class="muted">未提交（草稿）</span>'}${c.err ? ` <span class="s-fail">${c.err}</span>` : ''}</dd>
        ${c.imgs ? `<dt>产物</dt><dd><div class="thumbs">${Array.from({ length: c.imgs }, (_, k) => `<span class="thumb" style="${sw(i + k)}"></span>`).join('')}</div></dd>` : ''}
      </dl>
    </div></div>`;
}

function sidebar(active, extra) {
  const g = (label, items) => `<div class="grp"><b>${label}</b>${items.map(([k, t, isNew]) => `<div class="nav ${k === active ? 'on' : ''}"><span>${t}</span>${isNew ? '<span class="new">新</span>' : ''}</div>`).join('')}</div>`;
  const biz = [['overview', '概览'], ['users', '用户'], ['tasks', '生成任务'], ['devices', '设备']];
  if (extra) biz.splice(3, 0, extra);
  return `<aside class="side"><div class="brand"><i></i>幕芽后台</div>${g('经营', biz)}${g('运营内容', [['insp', '灵感库'], ['skills', '技能目录']])}${g('运维', [['logs', '服务端日志'], ['ops', '运维看板'], ['errors', '前端错误']])}${g('设置', [['agent', 'Agent 模型'], ['audit', '审计']])}</aside>`;
}

/* ---------- 方案 2 ---------- */
let filter2 = 'all';
function view2() {
  const items = TURNS.flatMap((t) => t.calls.map((c, k) => ({ t, c, k })));
  const shown = items.filter(({ c }) => filter2 === 'all' || (filter2 === 'edited' ? c.orig && c.final && c.orig !== c.final : c.state === filter2));
  const cnt = (f) => items.filter(({ c }) => f(c)).length;
  const cards = shown.map(({ t, c, k }, i) => `<article class="lcard">
    <div class="lmain">
      <div class="lmeta">${badge(c.state)}<span class="tag">${c.tool}</span><span class="mono muted">${c.target}</span><span class="muted">· ${c.n} 张 · ${c.size}</span>${c.orig && c.final && c.orig !== c.final ? '<span class="tag" style="color:var(--violet)">确认前被改过</span>' : ''}</div>
      ${promptBlock(c)}
      <div class="ctx"><span class="muted">用户原话：</span>${esc(t.said)}</div>
    </div>
    <div class="lside">
      <div><b>${t.user}</b> <span class="muted">${t.tier}</span></div>
      <div class="muted tnum">${t.at} · <span class="mono">${t.model}</span></div>
      ${c.imgs ? `<div class="thumbs">${Array.from({ length: c.imgs }, (_, j) => `<span class="thumb" style="${sw(i + j)}"></span>`).join('')}</div>` : `<div class="muted">${c.err ? `<span class="s-fail">${c.err}</span>` : c.task ? '等待产物' : '草稿未提交，未扣费'}</div>`}
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="copy" type="button">复制</button>${c.task ? `<button class="copy" type="button">任务 ${c.task}</button>` : ''}<button class="copy" type="button">看对话</button></div>
    </div></article>`).join('') || '<div class="hint">没有符合条件的提示词。</div>';
  const f = (key, label, n) => `<button class="chip ${filter2 === key ? 'on' : ''}" type="button" data-f="${key}">${label} ${n}</button>`;
  return sidebar('prompts', ['prompts', '提示词', true]) + `<main class="main">
    <div class="ph"><div><h2>提示词 <span class="markl">新页面</span></h2><p>chat 拟出的每一条生成提示词，包括用户还没确认的草稿。</p></div><span class="search">搜提示词、用户、任务 ID…</span></div>
    <div class="kpis mark">
      <div class="kpi"><b>1,284</b><span>今天 chat 产出的提示词</span></div>
      <div class="kpi"><b>23%</b><span>确认前被用户改过</span></div>
      <div class="kpi"><b>9%</b><span>草稿没有确认</span></div>
      <div class="kpi"><b>4.1%</b><span>提交后失败</span></div>
    </div>
    <div class="filters">${f('all', '全部', items.length)}${f('edited', '被改过', cnt((c) => c.orig && c.final && c.orig !== c.final))}${f('wait', '待确认', cnt((c) => c.state === 'wait'))}${f('fail', '失败', cnt((c) => c.state === 'fail'))}${f('ok', '已出图', cnt((c) => c.state === 'ok'))}</div>
    <div class="ledger mark">${cards}</div>
  </main>`;
}

function render() {
  document.getElementById('frame').innerHTML = view2();
}
document.addEventListener('click', (e) => {
  const f = e.target.closest('[data-f]');
  if (f) { filter2 = f.dataset.f; return render(); }
  const c = e.target.closest('.copy');
  if (c && c.textContent.startsWith('复制')) { const old = c.textContent; c.textContent = '已复制'; setTimeout(() => (c.textContent = old), 1000); }
});
render();
</script>
