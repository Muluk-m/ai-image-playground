<text x="500" y="751" font-size="25" fill="#f6f6f4" font-weight="600" text-anchor="middle">各任务只看自己的图，不读取其他图或其他任务的结果。</text>
<text x="500" y="792" font-size="22" fill="#a6a9a2" font-weight="400" text-anchor="middle">模型与设置共用；任务可同时执行或排队，无需等上一张完成。</text>
