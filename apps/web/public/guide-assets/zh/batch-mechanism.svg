<text x="192" y="432" font-size="27" fill="#a6a9a2" font-weight="400" text-anchor="middle">＋</text>
<rect x="64" y="448" width="256" height="66" rx="16" fill="#252e20" stroke="#566946"/>
<text x="192" y="490" font-size="25" fill="#c1eb94" font-weight="400" text-anchor="middle">同一份提示词 P</text>
