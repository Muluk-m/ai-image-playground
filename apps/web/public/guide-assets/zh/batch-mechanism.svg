<text x="680" y="312" font-size="25" fill="#f6f6f4" font-weight="600" text-anchor="start">独立任务 C</text>
<rect x="680" y="337" width="256" height="66" rx="16" fill="#252825" stroke="#323531"/>
<text x="808" y="379" font-size="25" fill="#f6f6f4" font-weight="400" text-anchor="middle">仅输入图 C</text>
