<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="幕芽 Muvloom，AI 图片与视频创作工作台。让灵感，长成画面。" />
    <meta name="application-name" content="幕芽 Muvloom" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="幕芽 Muvloom" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="幕芽 Muvloom · AI 图片与视频创作工作台" />
    <meta property="og:description" content="一句话生成图片，在无限画布上继续编辑，与 AI 智能体一起完成海报、商品图与短视频。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="幕芽 Muvloom · AI 图片与视频创作工作台" />
    <meta name="twitter:description" content="一句话生成图片，在无限画布上继续编辑，与 AI 智能体一起完成海报、商品图与短视频。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="幕芽" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" href="/brand/muvloom-icon.svg" type="image/svg+xml" />
    <!-- 启动配置与首屏 JS 并行拉：它是整条启动链的第一环，晚一个往返首帧就晚一个往返。 -->
    <link rel="preload" href="/runtime-config.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/hero/hero-8.webp" as="image" fetchpriority="low" />
    <title>幕芽 Muvloom · AI 图片与视频创作工作台</title>
    <style>
      /* 启动闪屏：HTML 一到就画，避免整条启动链（配置 → 会话 → 能力）期间是一片黑。
         React 首次渲染出任何界面后由内联启动守卫摘掉。 */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0f0c;
      }
      #boot img {
        width: 46px;
        margin: 0 auto;
        height: 46px;
        border-radius: 14px;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img {
          animation: none;
        }
      }
      #boot > div { text-align: center; padding: 24px; color: #eef2e8; font-family: system-ui, sans-serif; }
      #boot-error[hidden] { display: none; }
      #boot-error h1 { font-size: 18px; margin-top: 24px; }
      #boot-error p { font-size: 14px; color: #aab5a2; }
      #boot-retry { margin-top: 12px; border: 0; border-radius: 8px; padding: 10px 20px; background: #c6e999; color: #203014; cursor: pointer; }
      #boot[data-state="error"] { z-index: 10000; }
      #boot[data-state="error"] img { animation: none; }
    </style>
  </head>
  <body class="bg-background text-foreground min-h-screen">
    <div id="root"></div>
    <noscript>
      <h1>幕芽 Muvloom · AI 图片与视频创作工作台</h1>
      <p>一句话生成图片，在无限画布上继续编辑，与 AI 智能体一起完成海报、商品图与短视频。使用幕芽需要开启 JavaScript。</p>
      <p><a href="/guide/">使用指南</a> · <a href="/guide/en/">User guide</a></p>
    </noscript>
    <div id="boot"><div><img src="/brand/muvloom-icon.svg" alt="" />
      <div id="boot-error" role="alert" hidden>
        <h1 id="boot-error-title">工作台暂时无法打开</h1>
        <p id="boot-error-description">请重新加载页面后重试。</p>
        <button id="boot-retry" type="button">重新加载</button>
      </div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
