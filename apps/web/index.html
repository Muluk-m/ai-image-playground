<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="幕芽 Muvloom，AI 图片与视频创作工作台。让灵感，长成画面。" />
    <meta name="application-name" content="幕芽 Muvloom" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="幕芽 Muvloom" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="幕芽 Muvloom · AI 图片与视频创作工作台" />
    <meta property="og:description" content="一句话生成图片，在无限画布上继续编辑，与 AI 智能体一起完成海报、商品图与短视频。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="幕芽 Muvloom · AI 图片与视频创作工作台" />
    <meta name="twitter:description" content="一句话生成图片，在无限画布上继续编辑，与 AI 智能体一起完成海报、商品图与短视频。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="幕芽" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" href="/brand/muvloom-icon.svg" type="image/svg+xml" />
    <!-- 启动配置与首屏 JS 并行拉：它是整条启动链的第一环，晚一个往返首帧就晚一个往返。 -->
    <link rel="preload" href="/runtime-config.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/hero/hero-8.webp" as="image" fetchpriority="low" />
    <title>幕芽 Muvloom · AI 图片与视频创作工作台</title>
    <style>
      /* 启动闪屏：HTML 一到就画。芽在原地展开，盖住配置、会话和能力；
         工作台或故障页画出来之后由内联启动守卫淡出，不再脉冲、也不横移。 */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        background: #0b0f0c;
      }
      #boot .sprout {
        width: 76px;
        height: 76px;
        display: block;
        margin: 0 auto;
      }
      #boot .plate,
      #boot .petal {
        transform-box: fill-box;
        transform-origin: center;
      }
      #boot .plate {
        animation: boot-plate 0.42s cubic-bezier(0.16, 0.84, 0.32, 1) both;
      }
      #boot .petal {
        animation: boot-petal 0.55s cubic-bezier(0.16, 0.84, 0.24, 1) both;
        animation-delay: var(--d);
      }
      #boot[data-state="done"] {
        animation: boot-fade 0.65s ease forwards;
        pointer-events: none;
      }
      @keyframes boot-fade {
        to { opacity: 0; }
      }
      @keyframes boot-plate {
        from { opacity: 0; transform: scale(0.86); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-petal {
        from { opacity: 0; transform: scale(0.2); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .plate,
        #boot .petal {
          animation: none;
          opacity: 1;
        }
        #boot[data-state="done"] {
          animation: none;
          opacity: 0;
        }
      }
      #boot > div { text-align: center; padding: 24px; color: #eef2e8; font-family: system-ui, sans-serif; }
      #boot-error[hidden] { display: none; }
      #boot-error h1 { font-size: 18px; margin-top: 24px; }
      #boot-error p { font-size: 14px; color: #aab5a2; }
      #boot-retry { margin-top: 12px; border: 0; border-radius: 8px; padding: 10px 20px; background: #c6e999; color: #203014; cursor: pointer; }
      #boot[data-state="error"] { z-index: 10000; }
      #boot[data-state="error"] .plate,
      #boot[data-state="error"] .petal { animation: none; opacity: 1; }
    </style>
  </head>
  <body class="bg-background text-foreground min-h-screen">
    <div id="root"></div>
    <noscript>
      <h1>幕芽 Muvloom · AI 图片与视频创作工作台</h1>
      <p>一句话生成图片，在无限画布上继续编辑，与 AI 智能体一起完成海报、商品图与短视频。使用幕芽需要开启 JavaScript。</p>
      <p><a href="/guide/">使用指南</a> · <a href="/guide/en/">User guide</a></p>
    </noscript>
    <div id="boot" aria-busy="true"><div>
      <svg class="sprout" viewBox="0 0 64 64" aria-hidden="true">
        <rect class="plate" width="64" height="64" rx="15" fill="#23282b"/>
        <defs><linearGradient id="boot-bloom" x1="50" y1="12" x2="15" y2="54" gradientUnits="userSpaceOnUse"><stop stop-color="#dbffa0"/><stop offset="1" stop-color="#83eeb0"/></linearGradient></defs>
        <g fill="url(#boot-bloom)">
          <path class="petal" style="--d:80ms" d="M13 31c-4-1-4-6-3-12 1-5 4-7 10-7h9c6 0 9 3 8 8-1 4-4 5-8 4h-5c-3 0-4 2-5 5-1 3-4 4-6 2Z"/>
          <path class="petal" style="--d:180ms" d="M39 25c-1-9 5-14 14-14 0 10-5 15-14 14Z"/>
          <path class="petal" style="--d:280ms" d="M20 34c4 0 5 3 4 6-1 3 0 4 2 5 3 4-1 8-6 8h-3c-5 0-7-3-7-7v-3c0-5 4-8 10-9Z"/>
          <path class="petal" style="--d:400ms" d="M44 30c6-2 9 3 9 9v5c0 6-3 9-9 9h-8c-5 0-7-3-6-7 0-3 2-4 5-4 4 1 5-1 4-4-2-6 0-7 5-8Z"/>
        </g>
      </svg>
      <div id="boot-error" role="alert" hidden>
        <h1 id="boot-error-title">工作台暂时无法打开</h1>
        <p id="boot-error-description">请重新加载页面后重试。</p>
        <button id="boot-retry" type="button">重新加载</button>
      </div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
