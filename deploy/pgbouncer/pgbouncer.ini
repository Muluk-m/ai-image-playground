; Shared PgBouncer transaction-pooling configuration for ai-image-playground (ADR 0034 / PR-6.2).
; Serves all deployment databases on the `application-infra` network via wildcard routing.
; Session-level advisory locks and migrations bypass PgBouncer via `DIRECT_DATABASE_URL` /
; `MIGRATOR_DATABASE_URL` -> `postgres:5432`.

[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Least-privilege dynamic SCRAM-SHA-256 lookup via SECURITY DEFINER function in the `postgres` DB.
; Provisioned by `scripts/infra-compose.sh provision-pooler` (never grants superuser access).
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_dbname = postgres
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)

; Transaction pooling multiplexes short BFF/worker queries and pg_advisory_xact_lock transactions
; onto a bounded set of PostgreSQL backend connections.
pool_mode = transaction
max_client_conn = 200
default_pool_size = 15
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 30

; PgBouncer 1.21+ protocol-level prepared statement tracking keeps Bun SQL's default prepared
; statements compatible with transaction pooling.
max_prepared_statements = 200

; Keep backend connections fresh and bound wait times.
server_idle_timeout = 300
server_lifetime = 3600
client_idle_timeout = 0
query_wait_timeout = 30

; Bun SQL sends server timeout GUCs as startup parameters; ignore them cleanly here and enforce
; the same 60s/10s/60s defaults on each app role via ALTER ROLE ... SET in postgres-provision.
ignore_startup_parameters = extra_float_digits,options,statement_timeout,lock_timeout,idle_in_transaction_session_timeout

admin_users = pgbouncer_auth
stats_users = pgbouncer_auth
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
