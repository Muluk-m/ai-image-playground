# API-only ingress for deployments whose frontend is hosted elsewhere (see README option 3).
# The shared proxy contract stays in nginx.proxy.conf; this shape has no document root and
# hard-404s every non-API path so the API domain never serves a second frontend.
#
# Production ingress is restricted to the host domain proxy on the private edge network.
# That proxy must overwrite X-Forwarded-For with one canonical client address. Direct,
# loopback-only deployments fall back to the socket peer; forwarded chains are rejected.
map $http_x_forwarded_for $canonical_client_address {
    default $http_x_forwarded_for;
    "" $remote_addr;
    ~, $remote_addr;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    include /app/deploy/nginx.proxy.conf;

    location / {
        return 404;
    }
}
