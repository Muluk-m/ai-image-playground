x-application-environment: &application-environment
  env_file:
    - path: ${APP_ENV_FILE:?Set APP_ENV_FILE, or drive this file through scripts/app-compose.sh}
      required: true

# Every container's stdout/stderr goes to this deployment's log-collector over a Unix socket the
# Docker daemon dials from the host (docs/deploy/server-logs.md, ADR 0021). Docker keeps its own
# local copy, so `docker logs` still works; async means a collector that is down never blocks or
# fails a container, the driver reconnects and sends what it held. scripts/rollout-runtime.sh
# repeats these options for the containers it creates itself.
x-log-forward: &log-forward
  driver: fluentd
  options:
    fluentd-address: unix://${LOG_FORWARD_DIR:?Set LOG_FORWARD_DIR, or drive this file through scripts/app-compose.sh}/forward.sock
    fluentd-async: "true"
    fluentd-sub-second-precision: "true"
    fluentd-buffer-limit: "4096"
    fluentd-write-timeout: "1s"
    mode: non-blocking
    max-buffer-size: "1m"
    cache-disabled: "false"
    cache-max-size: "10m"
    cache-max-file: "3"

x-application-service: &application-service
  <<: *application-environment
  image: ${APP_IMAGE:-ai-image-playground:local}
  init: true
  restart: unless-stopped
  logging: *log-forward

x-operator-config-volumes: &operator-config-volumes
  - type: bind
    source: ${APP_CONFIG_DIR:?Set APP_CONFIG_DIR, or drive this file through scripts/app-compose.sh}
    target: /run/operator
    read_only: true
    bind:
      create_host_path: false

services:
  dependency-check:
    <<: *application-service
    environment:
      APP_ROLE: dependency-check
    restart: on-failure:12
    command:
      - bun
      - run
      - /app/scripts/check-dependencies.ts
    networks:
      # application-infra is internal, and the object store probe reaches a public endpoint.
      - application
      - application-infra

  migrate:
    <<: *application-service
    env_file:
      - path: ${APP_ENV_FILE:?Set APP_ENV_FILE, or drive this file through scripts/app-compose.sh}
        required: true
      - path: ${MIGRATOR_ENV_FILE:?Set MIGRATOR_ENV_FILE to the external migrator environment file}
        required: true
    environment:
      APP_ROLE: migrate
    restart: "no"
    command:
      - bun
      - run
      - /app/apps/bff/src/db/migrate.ts
    depends_on:
      dependency-check:
        condition: service_completed_successfully
    networks:
      - application-infra
    volumes: *operator-config-volumes

  bff:
    <<: *application-service
    environment:
      APP_ROLE: bff
      PORT: "37377"
      # Per-process connection caps. Both deployments share one PostgreSQL (max_connections 100),
      # and a rollout runs a second bff and worker beside the old pair: 2 x (6 + 4 + 3 + 1 + 1) = 30
      # steady (including a single log connection per bff/worker), under 60 with both deployments mid-rollout plus migrate and pg-backup. Queries past
      # the cap wait for a free connection instead of failing. The BFF's work is short
      # transactions; its background sweeps (agent inbox pickup, retries, purge, heartbeat) each
      # hold one at a time, leaving most for requests. scripts/rollout-runtime.sh repeats the bff
      # and worker values.
      DATABASE_POOL_MAX: "6"
      STATIC_DIR: ""
      EXECUTOR_ORIGIN: http://bff:37377
      # Override in app.env when something other than cloudflared terminates the ingress.
      CLIENT_IP_SOURCE: ${CLIENT_IP_SOURCE:-cf-connecting-ip}
    command:
      - bun
      - run
      - /app/apps/bff/src/index.ts
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 75s
    networks:
      - application
      - application-infra
    volumes: *operator-config-volumes
    healthcheck:
      test:
        - CMD
        - bun
        - run
        - /app/apps/bff/src/container-healthcheck.ts
        - http://127.0.0.1:37377/health
        - /tmp/bff-health.json
        - "12"
        - "3"
        - "60000"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *application-service
    environment:
      APP_ROLE: worker
      WORKER_HEALTH_PORT: "37379"
      # One per in-flight task at the default WORKER_OPENAI_CONCURRENCY + WORKER_GEMINI_CONCURRENCY
      # (1 + 2), plus one so the queue poll and maintenance loop never wait behind settlements.
      # Raise it with those concurrencies.
      DATABASE_POOL_MAX: "4"
    command:
      - bun
      - run
      - /app/apps/bff/src/worker-index.ts
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Must exceed WORKER_DRAIN_TIMEOUT_MS (default 55s) plus the abort settle window, or Docker
    # sends SIGKILL mid-drain and the inflight tasks are recovered only by the stale scan.
    stop_grace_period: 75s
    networks:
      - application
      - application-infra
    volumes: *operator-config-volumes
    healthcheck:
      test:
        - CMD
        - bun
        - run
        - /app/apps/bff/src/container-healthcheck.ts
        - http://127.0.0.1:37379/health
        - /tmp/worker-health.json
        - "1"
        - "3"
        - "60000"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin:
    <<: *application-service
    environment:
      APP_ROLE: admin
      PORT: "37378"
      # Operator traffic only; the operations board fans out a dozen short reads per load.
      DATABASE_POOL_MAX: "3"
      # ADMIN_DIST_DIR is deliberately absent: app.env owns it. Empty there makes Admin
      # API-only (the frontend is its own Pages project); unset falls back to the image
      # default that still serves dist, which is the rollback path.
      BFF_INTERNAL_URL: ${BFF_INTERNAL_URL:-http://bff:37377}
      OPS_DEPLOYMENTS_LOG: /host/deployments.log
    command:
      - bun
      - run
      - /app/apps/admin/server/index.ts
    # The deploy log, read-only, for the operations board's deployment list. It holds commit ids,
    # image tags and the deploying account, no secrets. Absent on hosts that never ran the deploy
    # script, where /dev/null stands in and the board says so.
    volumes:
      - type: bind
        source: ${DEPLOYMENTS_LOG_SOURCE:-/dev/null}
        target: /host/deployments.log
        read_only: true
    depends_on:
      bff:
        condition: service_healthy
      dependency-check:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks:
      application:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-admin
      application-infra:
    healthcheck:
      test:
        - CMD
        - bun
        - run
        - /app/apps/bff/src/container-healthcheck.ts
        - http://127.0.0.1:37378/health
        - /tmp/admin-health.json
        - "12"
        - "3"
        - "60000"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    <<: *application-service
    environment:
      APP_ROLE: web
      RUNTIME_CONFIG_FILE: /usr/share/nginx/html/runtime-config.json
    command:
      - nginx
      - -g
      - daemon off;
    depends_on:
      bff:
        condition: service_healthy
    stop_grace_period: 15s
    networks:
      application:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-web
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://127.0.0.1:8080/nginx-health'); process.exit(response.ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    init: true
    restart: unless-stopped
    logging: *log-forward
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - type: bind
        source: ${APP_CONFIG_DIR:?Set APP_CONFIG_DIR, or drive this file through scripts/app-compose.sh}/cloudflared
        target: /etc/cloudflared
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - application

  # Samples the host's disk and memory for the operations board (docs/adr/0018-host-sampling-without-the-docker-socket.md). It gets exactly
  # two read-only files from the host and no Docker socket: /proc/meminfo, and one file that lives
  # on the filesystem to watch, because statfs on a bind-mounted file reports the filesystem behind
  # it. If Docker's data sits on a separate partition, point HOST_DISK_PROBE_SOURCE at a file
  # there. Named variables instead of app.env, like pg-backup: no provider, database or object
  # store credential belongs in here.
  host-collector:
    image: ${APP_IMAGE:-ai-image-playground:local}
    init: true
    restart: unless-stopped
    logging: *log-forward
    environment:
      APP_ROLE: host-collector
      BFF_INTERNAL_URL: ${BFF_INTERNAL_URL:-http://bff:37377}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # Disk and memory alerts go out from here, not through the BFF: a full disk is exactly when
      # the BFF and the database stop answering.
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_HOST_ALERTS: ${OPS_HOST_ALERTS:-true}
      OPS_DEPLOYMENT_NAME: ${OPS_DEPLOYMENT_NAME:-${COMPOSE_PROJECT_NAME:-deployment}}
    command:
      - bun
      - run
      - /app/apps/bff/src/host-collector-index.ts
    volumes:
      - type: bind
        source: ${HOST_DISK_PROBE_SOURCE:-/etc/hostname}
        target: /host/disk-probe
        read_only: true
      - type: bind
        source: /proc/meminfo
        target: /host/meminfo
        read_only: true
      - type: bind
        source: /proc/stat
        target: /host/stat
        read_only: true
      - type: bind
        source: /proc/loadavg
        target: /host/loadavg
        read_only: true
      # Per-container memory, CPU and OOM kills, read from cgroup files. Read-only and without the
      # Docker socket: it can see how much each container uses, not what is inside it (ADR 0018).
      - type: bind
        source: /sys/fs/cgroup
        target: /host/cgroup
        read_only: true
      - type: bind
        source: ${OPS_BOARD_DIR:?Set OPS_BOARD_DIR, or drive this file through scripts/app-compose.sh}
        target: /host/ops-board
        read_only: true
        bind:
          create_host_path: false
    # Deliberately no depends_on: a BFF that never turns healthy is one of the moments the disk
    # and memory alerts are for. Reports to it simply fail and are retried on the next sample.
    networks:
      - application

  pg-backup:
    image: ${BACKUP_IMAGE:-ai-image-playground-pg-backup:local}
    init: true
    restart: unless-stopped
    logging: *log-forward
    # Named one by one rather than through app.env: this container must not hold provider
    # credentials, and its cron shim writes whatever it receives to a file.
    environment:
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?Set ADMIN_DATABASE_URL in the application environment file}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in the application environment file}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in the application environment file}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in the application environment file}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in the application environment file}
    networks:
      - application
      - application-infra
    healthcheck:
      test:
        - CMD
        - sh
        - /usr/local/bin/healthcheck.sh
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 30s

  # Receives every container's output on the Unix socket in LOG_FORWARD_DIR and posts it to the
  # BFF's /internal/logs/ingest through the stable router, which stores it for the Admin logs page.
  # Chunks stay in the log-buffer volume until the BFF accepts them, so a BFF or database restart
  # delays logs instead of losing them. Its own output stays with Docker: forwarding it here
  # would loop. No database or provider credential; only the internal token for the ingest call.
  log-collector:
    image: fluent/fluent-bit:5.1.3
    restart: unless-stopped
    command: ["-c", "/etc/fluent-bit/collector.yaml"]
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    configs:
      - source: log-collector
        target: /etc/fluent-bit/collector.yaml
    volumes:
      - type: bind
        source: ${LOG_FORWARD_DIR:?Set LOG_FORWARD_DIR, or drive this file through scripts/app-compose.sh}
        target: /run/log-forward
        bind:
          create_host_path: false
      - log-buffer:/buffer
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    networks:
      - application

configs:
  log-collector:
    # $$ leaves ${INTERNAL_API_TOKEN} for Fluent Bit to read from its environment, so the token
    # never lands in the rendered file.
    content: |
      service:
        flush: 2
        log_level: warn
        storage.path: /buffer
        storage.max_chunks_up: 64
      pipeline:
        inputs:
          - name: forward
            unix_path: /run/log-forward/forward.sock
            unix_perm: "0660"
            storage.type: filesystem
        outputs:
          - name: http
            match: "*"
            host: ${LOG_INGEST_HOST:-release-router}
            port: 37377
            uri: /internal/logs/ingest
            format: json
            json_date_key: date
            json_date_format: double
            header: Authorization Bearer $${INTERNAL_API_TOKEN}
            retry_limit: no_limits
            storage.total_limit_size: 256M

volumes:
  log-buffer:

networks:
  application:
  application-infra:
    external: true
    name: ${INFRA_NETWORK_NAME:-image-playground-infra}
