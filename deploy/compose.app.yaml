x-application-environment: &application-environment
  env_file:
    - path: ${APP_ENV_FILE:?Set APP_ENV_FILE, or drive this file through scripts/app-compose.sh}
      required: true

# Every container's stdout/stderr goes to this deployment's log-collector over a Unix socket the
# Docker daemon dials from the host (docs/deploy/server-logs.md, ADR 0021). Docker keeps its own
# local copy, so `docker logs` still works; async means a collector that is down never blocks or
# fails a container, the driver reconnects and sends what it held. scripts/rollout-runtime.sh
# repeats these options for the containers it creates itself.
x-log-forward: &log-forward
  driver: fluentd
  options:
    fluentd-address: unix://${LOG_FORWARD_DIR:?Set LOG_FORWARD_DIR, or drive this file through scripts/app-compose.sh}/forward.sock
    fluentd-async: "true"
    fluentd-sub-second-precision: "true"
    fluentd-buffer-limit: "4096"
    fluentd-write-timeout: "1s"
    mode: non-blocking
    max-buffer-size: "1m"
    cache-disabled: "false"
    cache-max-size: "10m"
    cache-max-file: "3"

x-application-service: &application-service
  <<: *application-environment
  image: ${APP_IMAGE:-ai-image-playground:local}
  init: true
  restart: unless-stopped
  logging: *log-forward

x-operator-config-volumes: &operator-config-volumes
  - type: bind
    source: ${APP_CONFIG_DIR:?Set APP_CONFIG_DIR, or drive this file through scripts/app-compose.sh}
    target: /run/operator
    read_only: true
    bind:
      create_host_path: false

services:
  dependency-check:
    <<: *application-service
    environment:
      APP_ROLE: dependency-check
    restart: on-failure:12
    command:
      - bun
      - run
      - /app/scripts/check-dependencies.ts
    networks:
      # application-infra is internal, and the object store probe reaches a public endpoint.
      - application
      - application-infra

  migrate:
    <<: *application-service
    env_file:
      - path: ${APP_ENV_FILE:?Set APP_ENV_FILE, or drive this file through scripts/app-compose.sh}
        required: true
      - path: ${MIGRATOR_ENV_FILE:?Set MIGRATOR_ENV_FILE to the external migrator environment file}
        required: true
    environment:
      APP_ROLE: migrate
    restart: "no"
    command:
      - bun
      - run
      - /app/apps/bff/src/db/migrate.ts
    depends_on:
      dependency-check:
        condition: service_completed_successfully
    networks:
      - application-infra
    volumes: *operator-config-volumes

  bff:
    <<: *application-service
    environment:
      APP_ROLE: bff
      PORT: "37377"
      # Per-process connection caps. Both deployments share one PostgreSQL (max_connections 100),
      # and a rollout runs a second bff and worker beside the old pair: 2 x (6 + 4 + 3 + 1 + 1) = 30
      # steady (including a single log connection per bff/worker), under 60 with both deployments mid-rollout plus migrate and pg-backup. Queries past
      # the cap wait for a free connection instead of failing. The BFF's work is short
      # transactions; its background sweeps (agent inbox pickup, retries, purge, heartbeat) each
      # hold one at a time, leaving most for requests. scripts/rollout-runtime.sh repeats the bff
      # and worker values.
      DATABASE_POOL_MAX: "6"
      STATIC_DIR: ""
      EXECUTOR_ORIGIN: http://bff:37377
      # The shared segmenter, when vps-deploy.sh turned it on for this edition (empty otherwise,
      # which leaves the edit-region card on the agent's box). rollout-runtime.sh does the same.
      AGENT_SEGMENTER_URL: ${AGENT_SEGMENTER_URL:-}
      AGENT_SEGMENTER_NAMESPACE: ${AGENT_SEGMENTER_NAMESPACE:-}
      # Override in app.env when something other than cloudflared terminates the ingress.
      CLIENT_IP_SOURCE: ${CLIENT_IP_SOURCE:-cf-connecting-ip}
    command:
      - bun
      - run
      - /app/apps/bff/src/index.ts
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 75s
    networks:
      application:
        aliases:
          - bff-logs
      application-infra:
    volumes: *operator-config-volumes
    healthcheck:
      test:
        - CMD
        - bun
        - run
        - /app/apps/bff/src/container-healthcheck.ts
        - http://127.0.0.1:37377/health
        - /tmp/bff-health.json
        - "12"
        - "3"
        - "60000"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *application-service
    environment:
      APP_ROLE: worker
      WORKER_HEALTH_PORT: "37379"
      # One per in-flight task at the default WORKER_OPENAI_CONCURRENCY + WORKER_GEMINI_CONCURRENCY
      # (1 + 2), plus one so the queue poll and maintenance loop never wait behind settlements.
      # Raise it with those concurrencies.
      DATABASE_POOL_MAX: "4"
      AGENT_SEGMENTER_URL: ${AGENT_SEGMENTER_URL:-}
      AGENT_SEGMENTER_NAMESPACE: ${AGENT_SEGMENTER_NAMESPACE:-}
    command:
      - bun
      - run
      - /app/apps/bff/src/worker-index.ts
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Must exceed WORKER_DRAIN_TIMEOUT_MS (default 55s) plus the abort settle window, or Docker
    # sends SIGKILL mid-drain and the inflight tasks are recovered only by the stale scan.
    stop_grace_period: 75s
    networks:
      - application
      - application-infra
    volumes: *operator-config-volumes
    healthcheck:
      test:
        - CMD
        - bun
        - run
        - /app/apps/bff/src/container-healthcheck.ts
        - http://127.0.0.1:37379/health
        - /tmp/worker-health.json
        - "1"
        - "3"
        - "60000"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin:
    <<: *application-service
    environment:
      APP_ROLE: admin
      PORT: "37378"
      # Operator traffic only; the operations board fans out a dozen short reads per load.
      DATABASE_POOL_MAX: "3"
      # ADMIN_DIST_DIR is deliberately absent: app.env owns it. Empty there makes Admin
      # API-only (the frontend is its own Pages project); unset falls back to the image
      # default that still serves dist, which is the rollback path.
      BFF_INTERNAL_URL: ${BFF_INTERNAL_URL:-http://bff:37377}
      OPS_DEPLOYMENTS_LOG: /host/deployments.log
    command:
      - bun
      - run
      - /app/apps/admin/server/index.ts
    # The deploy log, read-only, for the operations board's deployment list. It holds commit ids,
    # image tags and the deploying account, no secrets. Absent on hosts that never ran the deploy
    # script, where /dev/null stands in and the board says so.
    volumes:
      - type: bind
        source: ${DEPLOYMENTS_LOG_SOURCE:-/dev/null}
        target: /host/deployments.log
        read_only: true
    depends_on:
      bff:
        condition: service_healthy
      dependency-check:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks:
      application:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-admin
      application-infra:
    healthcheck:
      test:
        - CMD
        - bun
        - run
        - /app/apps/bff/src/container-healthcheck.ts
        - http://127.0.0.1:37378/health
        - /tmp/admin-health.json
        - "12"
        - "3"
        - "60000"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    <<: *application-service
    environment:
      APP_ROLE: web
      RUNTIME_CONFIG_FILE: /usr/share/nginx/html/runtime-config.json
    command:
      - nginx
      - -g
      - daemon off;
    depends_on:
      bff:
        condition: service_healthy
    stop_grace_period: 15s
    networks:
      application:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-web
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://127.0.0.1:8080/nginx-health'); process.exit(response.ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    init: true
    restart: unless-stopped
    logging: *log-forward
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - type: bind
        source: ${APP_CONFIG_DIR:?Set APP_CONFIG_DIR, or drive this file through scripts/app-compose.sh}/cloudflared
        target: /etc/cloudflared
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - application

  # Samples the host's disk and memory for the operations board (docs/adr/0018-host-sampling-without-the-docker-socket.md). It gets exactly
  # two read-only files from the host and no Docker socket: /proc/meminfo, and one file that lives
  # on the filesystem to watch, because statfs on a bind-mounted file reports the filesystem behind
  # it. If Docker's data sits on a separate partition, point HOST_DISK_PROBE_SOURCE at a file
  # there. Named variables instead of app.env, like pg-backup: no provider, database or object
  # store credential belongs in here.
  host-collector:
    image: ${APP_IMAGE:-ai-image-playground:local}
    init: true
    restart: unless-stopped
    logging: *log-forward
    environment:
      APP_ROLE: host-collector
      BFF_INTERNAL_URL: ${BFF_INTERNAL_URL:-http://bff:37377}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # Disk and memory alerts go out from here, not through the BFF: a full disk is exactly when
      # the BFF and the database stop answering.
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_WEBHOOK_URLS: ${OPS_ALERT_WEBHOOK_URLS:-}
      OPS_ALERT_WEBHOOK_HEADERS: ${OPS_ALERT_WEBHOOK_HEADERS:-}
      OPS_HOST_ALERTS: ${OPS_HOST_ALERTS:-true}
      OPS_DEPLOYMENT_NAME: ${OPS_DEPLOYMENT_NAME:-${COMPOSE_PROJECT_NAME:-deployment}}
    command:
      - bun
      - run
      - /app/apps/bff/src/host-collector-index.ts
    volumes:
      - type: bind
        source: ${HOST_DISK_PROBE_SOURCE:-/etc/hostname}
        target: /host/disk-probe
        read_only: true
      - type: bind
        source: /proc/meminfo
        target: /host/meminfo
        read_only: true
      - type: bind
        source: /proc/stat
        target: /host/stat
        read_only: true
      - type: bind
        source: /proc/loadavg
        target: /host/loadavg
        read_only: true
      # Per-container memory, CPU and OOM kills, read from cgroup files. Read-only and without the
      # Docker socket: it can see how much each container uses, not what is inside it (ADR 0018).
      - type: bind
        source: /sys/fs/cgroup
        target: /host/cgroup
        read_only: true
      - type: bind
        source: ${OPS_BOARD_DIR:?Set OPS_BOARD_DIR, or drive this file through scripts/app-compose.sh}
        target: /host/ops-board
        read_only: true
        bind:
          create_host_path: false
    # Deliberately no depends_on: a BFF that never turns healthy is one of the moments the disk
    # and memory alerts are for. Reports to it simply fail and are retried on the next sample.
    networks:
      - application

  pg-backup:
    image: ${BACKUP_IMAGE:-ai-image-playground-pg-backup:local}
    init: true
    restart: unless-stopped
    logging: *log-forward
    # Named one by one rather than through app.env: this container must not hold provider
    # credentials, and its cron shim writes whatever it receives to a file.
    environment:
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?Set ADMIN_DATABASE_URL in the application environment file}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in the application environment file}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in the application environment file}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in the application environment file}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in the application environment file}
      # Seconds before a failed restore drill is retried at container start.
      PG_DRILL_RETRY_AFTER_SECONDS: ${PG_DRILL_RETRY_AFTER_SECONDS:-21600}
    networks:
      - application
      - application-infra
    healthcheck:
      test:
        - CMD
        - sh
        - /usr/local/bin/healthcheck.sh
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 30s

  # Receives every container's output on the Unix socket in LOG_FORWARD_DIR and posts it to the
  # BFF's /internal/logs/ingest through the stable router, which stores it for the Admin logs page.
  # Chunks stay in the log-buffer volume until the BFF accepts them, so a BFF or database restart
  # delays logs instead of losing them. Its own output stays with Docker: forwarding it here
  # would loop. No database or provider credential; only the internal token for the ingest call.
  log-collector:
    image: fluent/fluent-bit:5.1.3
    # Inline config contents did not recreate an existing collector during rollout. Include its
    # rendered destination in the service configuration so a target change reloads the config.
    labels:
      ai.image-playground.log-ingest-host: ${LOG_INGEST_HOST:-bff-logs}
      ai.image-playground.log-format: multiline-v1
      ai.image-playground.log-copy-match: ${OBS_LOG_MATCH:-__observability_off__}
    restart: unless-stopped
    command: ["-c", "/etc/fluent-bit/collector.yaml"]
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    configs:
      - source: log-collector
        target: /etc/fluent-bit/collector.yaml
    volumes:
      - type: bind
        source: ${LOG_FORWARD_DIR:?Set LOG_FORWARD_DIR, or drive this file through scripts/app-compose.sh}
        target: /run/log-forward
        bind:
          create_host_path: false
      - log-buffer:/buffer
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    networks:
      - application

  # ---- Observability (ADR 0033, P2). Off unless OBSERVABILITY_ENABLED=true in app.env: these
  # services sit behind the `observability` profile and scripts/app-compose.sh turns the profile and
  # the log collector's second output on together. Fluent Bit keeps feeding server_logs; this is a
  # second copy, so turning it off again loses nothing.

  # Logs, traces and their indexes, stored as Parquet in the R2 bucket named below; the local
  # volume only holds the write-ahead log and a bounded query cache. The open-source edition has no
  # read-only role, so nothing outside this network talks to it directly: queries go through
  # obs-proxy. Named variables instead of app.env, like pg-backup.
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.1.2
    profiles: [observability]
    init: true
    restart: unless-stopped
    # Its own output stays with Docker: every ingest request it logs would travel back to it through
    # the log copy below, a loop that never settles (and fills server_logs on the way).
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ZO_ROOT_USER_EMAIL: ${OBS_ROOT_EMAIL:-}
      ZO_ROOT_USER_PASSWORD: ${OBS_ROOT_PASSWORD:-}
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: s3
      ZO_S3_PROVIDER: s3
      ZO_S3_SERVER_URL: ${OBS_S3_ENDPOINT:-}
      ZO_S3_REGION_NAME: auto
      ZO_S3_BUCKET_NAME: ${OBS_S3_BUCKET:-}
      ZO_S3_BUCKET_PREFIX: ${OBS_S3_PREFIX:-}
      ZO_S3_ACCESS_KEY: ${OBS_S3_ACCESS_KEY_ID:-}
      ZO_S3_SECRET_KEY: ${OBS_S3_SECRET_ACCESS_KEY:-}
      ZO_DATA_DIR: /data
      ZO_COMPACT_DATA_RETENTION_DAYS: ${OBS_RETENTION_DAYS:-30}
      # The host has 3.6 GB of memory and ~19 GB of free disk for everything; caches are capped
      # instead of sized from it (1 GB of data cache, 128 MB of result cache in openobserve-data).
      ZO_DISK_CACHE_MAX_SIZE: "1024"
      ZO_DISK_RESULT_CACHE_MAX_SIZE: "128"
      ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "128"
      # No calls out besides R2: no usage heartbeat, GeoIP database or model price list.
      ZO_TELEMETRY: "false"
      ZO_MMDB_DISABLE_DOWNLOAD: "true"
      ZO_MODEL_PRICING_ENABLED: "false"
    volumes:
      - openobserve-data:/data
    mem_limit: 512m
    stop_grace_period: 30s
    # The image is distroless (no shell, no curl), so there is no container healthcheck; the
    # operations board sees it through obs-proxy, which answers 502 when OpenObserve is down.
    # The web UI is on the host's loopback only, for an SSH tunnel; it logs in with the root
    # account above. Each deployment on the host needs its own port.
    ports:
      - 127.0.0.1:${OBS_UI_HOST_PORT:-15080}:5080
    networks:
      - application

  # One Collector per deployment. Receives OTLP spans from the BFF and worker
  # (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 in app.env) and the container logs
  # Fluent Bit forwards after its multiline merge; parses pino lines, maps levels, joins logs to
  # traces and redacts before anything leaves. A sending queue on disk holds data while
  # OpenObserve restarts.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: [observability]
    restart: unless-stopped
    labels:
      ai.image-playground.collector-config: otel-v1
    command: ["--config=/etc/otelcol/config.yaml"]
    # The image runs as 10001 and a fresh named volume is root-owned, so the disk queue could not
    # be written. No credentials beyond the OpenObserve account, no host mounts.
    user: "0:0"
    environment:
      OBS_ROOT_EMAIL: ${OBS_ROOT_EMAIL:-}
      OBS_ROOT_PASSWORD: ${OBS_ROOT_PASSWORD:-}
      OBS_ORG: ${OBS_ORG:-default}
      OBS_DEPLOYMENT: ${COMPOSE_PROJECT_NAME:-deployment}
    configs:
      - source: otel-collector
        target: /etc/otelcol/config.yaml
    volumes:
      - otel-queue:/var/lib/otelcol
    # Like log-collector: its own output stays with Docker, forwarding it would loop.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 200m
    networks:
      application:
        aliases:
          - otel-collector

  # The only way in to OpenObserve from outside: a Bearer token of its own, query paths only, and
  # it fills in the OpenObserve account itself (apps/bff/src/ops/obs-proxy.ts). scripts/obs.ts
  # talks to it. No database credential, like host-collector.
  obs-proxy:
    image: ${APP_IMAGE:-ai-image-playground:local}
    profiles: [observability]
    init: true
    restart: unless-stopped
    logging: *log-forward
    environment:
      APP_ROLE: obs-proxy
      PORT: "5090"
      OBS_UPSTREAM_URL: http://openobserve:5080
      OBS_ORG: ${OBS_ORG:-default}
      OBS_ROOT_EMAIL: ${OBS_ROOT_EMAIL:-}
      OBS_ROOT_PASSWORD: ${OBS_ROOT_PASSWORD:-}
      OBS_PROXY_TOKEN: ${OBS_PROXY_TOKEN:-}
    command:
      - bun
      - run
      - /app/apps/bff/src/obs-proxy-index.ts
    # Loopback only: scripts/obs.ts reaches it through an SSH tunnel, nothing is published to the
    # internet. Each deployment on the host needs its own port.
    ports:
      - 127.0.0.1:${OBS_PROXY_HOST_PORT:-15090}:5090
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://127.0.0.1:5090/healthz'); process.exit(response.ok ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

configs:
  log-collector:
    # $$ leaves ${INTERNAL_API_TOKEN} for Fluent Bit to read from its environment, so the token
    # never lands in the rendered file.
    content: |
      service:
        flush: 2
        log_level: warn
        storage.path: /buffer
        storage.max_chunks_up: 64
      multiline_parsers:
        - name: terminal-stack
          type: regex
          key_content: log
          flush_timeout: 1000
          rules:
            - state: start_state
              regex: '/^(?i:(?:warn|warning|error|fatal|panic|[a-z]*error|exception)\b)/'
              next_state: cont
            - state: cont
              regex: '/^(?:\s+at\s|\s*$$|\s*\.\.\.|\s*Caused by:)/'
              next_state: cont
      pipeline:
        inputs:
          - name: forward
            unix_path: /run/log-forward/forward.sock
            unix_perm: "0660"
            storage.type: filesystem
        filters:
          # Only raw Docker tags have no dot. Re-emitted records bypass this filter.
          - name: rewrite_tag
            match_regex: '^[^.]+$$'
            rule: '$$source ^(stdout|stderr)$$ $$TAG.$$1 false'
            emitter_storage.type: filesystem
            emitter_mem_buf_limit: 8M
          - name: multiline
            match: "*"
            multiline.key_content: log
            multiline.parser: terminal-stack
            buffer: on
            flush_ms: 1000
            emitter_storage.type: filesystem
            emitter_mem_buf_limit: 8M
        outputs:
          - name: http
            match: "*"
            host: ${LOG_INGEST_HOST:-bff-logs}
            port: 37377
            uri: /internal/logs/ingest
            format: json
            json_date_key: date
            json_date_format: double
            header: Authorization Bearer $${INTERNAL_API_TOKEN}
            retry_limit: no_limits
            storage.total_limit_size: 256M
          # Second copy to the observability Collector (ADR 0033 P2), after the multiline merge.
          # scripts/app-compose.sh sets OBS_LOG_MATCH to * only when OBSERVABILITY_ENABLED=true;
          # otherwise it matches no tag and this output never holds a chunk. Bounded on its own, so
          # a Collector that is down cannot take the server_logs copy's disk.
          - name: forward
            match: "${OBS_LOG_MATCH:-__observability_off__}"
            host: otel-collector
            port: 8006
            # Plain [time, record] entries: the Collector's fluent_forward receiver rejects
            # Fluent Bit's [[time, metadata], record] form outright. Sub-second time comes back
            # from pino's own `time` field in the Collector.
            time_as_integer: true
            retry_limit: no_limits
            storage.total_limit_size: 128M

  otel-collector:
    # $$ leaves ${env:...} and regex group references for the Collector; credentials are read from
    # its environment and never land in the rendered file.
    content: |
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
        file_storage/queue:
          directory: /var/lib/otelcol
          create_directory: true
        basicauth/openobserve:
          client_auth:
            username: $${env:OBS_ROOT_EMAIL}
            password: $${env:OBS_ROOT_PASSWORD}
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
        fluent_forward:
          endpoint: 0.0.0.0:8006
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 150
          spike_limit_mib: 30
        transform/logs:
          error_mode: ignore
          log_statements:
            - context: log
              statements:
                # pino lines: every field becomes an attribute, the message becomes the body.
                - merge_maps(attributes, ParseJSON(body), "upsert") where IsMatch(body, "^\\s*\\{")
                - set(body, attributes["msg"]) where attributes["msg"] != nil
                # pino keeps milliseconds; the forward protocol only carries whole seconds.
                - set(time, Time(attributes["time"], "%Y-%m-%dT%H:%M:%S.%LZ")) where IsString(attributes["time"]) and IsMatch(attributes["time"], "^\\d{4}-\\d{2}-\\d{2}T")
                - delete_key(attributes, "time")
                - delete_key(attributes, "msg")
                # Logs carry the span they were written in (pino mixin); link them to the trace.
                - set(trace_id.string, attributes["trace_id"]) where attributes["trace_id"] != nil
                - set(span_id.string, attributes["span_id"]) where attributes["span_id"] != nil
                - delete_key(attributes, "trace_id")
                - delete_key(attributes, "span_id")
                # pino numeric levels, string levels (host-collector), cloudflared's INF/WRN/ERR.
                - set(severity_number, SEVERITY_NUMBER_TRACE) where attributes["level"] == 10
                - set(severity_number, SEVERITY_NUMBER_DEBUG) where attributes["level"] == 20
                - set(severity_number, SEVERITY_NUMBER_INFO) where attributes["level"] == 30 or attributes["level"] == "info"
                - set(severity_number, SEVERITY_NUMBER_WARN) where attributes["level"] == 40 or attributes["level"] == "warn"
                - set(severity_number, SEVERITY_NUMBER_ERROR) where attributes["level"] == 50 or attributes["level"] == "error"
                - set(severity_number, SEVERITY_NUMBER_FATAL) where attributes["level"] == 60 or attributes["level"] == "fatal"
                # Same as the old server_logs parser (container-logs.ts): FTL is fatal, and a client
                # that hung up mid-request (cloudflared `ERR ... context canceled`) is only a warning.
                - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(body, "^\\S+\\s+FTL\\s")
                - set(severity_number, SEVERITY_NUMBER_WARN) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(body, "^\\S+\\s+ERR\\s") and IsMatch(body, "\\bcontext canceled\\b")
                - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(body, "^\\S+\\s+ERR\\s")
                - set(severity_number, SEVERITY_NUMBER_WARN) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(body, "^\\S+\\s+WRN\\s")
                - set(severity_number, SEVERITY_NUMBER_INFO) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(body, "^\\S+\\s+INF\\s")
                - set(severity_number, SEVERITY_NUMBER_WARN) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["source"] == "stderr"
                - set(severity_number, SEVERITY_NUMBER_INFO) where severity_number == SEVERITY_NUMBER_UNSPECIFIED
                - set(severity_text, "TRACE") where severity_number == SEVERITY_NUMBER_TRACE
                - set(severity_text, "DEBUG") where severity_number == SEVERITY_NUMBER_DEBUG
                - set(severity_text, "INFO") where severity_number == SEVERITY_NUMBER_INFO
                - set(severity_text, "WARN") where severity_number == SEVERITY_NUMBER_WARN
                - set(severity_text, "ERROR") where severity_number == SEVERITY_NUMBER_ERROR
                - set(severity_text, "FATAL") where severity_number == SEVERITY_NUMBER_FATAL
                - delete_key(attributes, "level")
                # Service from the container name when the line did not say (cloudflared, backups).
                - set(attributes["service"], attributes["container_name"]) where attributes["service"] == nil and attributes["container_name"] != nil
                - replace_pattern(attributes["service"], "^/?.*-(bff|worker|admin|cloudflared|host-collector|pg-backup|release-router|migrate|obs-proxy|openobserve|dependency-check)(-[0-9]+)?$$", "$$1")
                # Redaction, the same rules as server_logs (packages/shared/src/redact-log.ts):
                # drop private fields at any depth, then scrub credential-shaped fragments.
                - flatten(attributes)
                - delete_matching_keys(attributes, "(?i)(^|\\.)(authorization|cookie|set-cookie|headers|[^.]*(password|secret|token|api[_-]?key)|body|payload|payloadpreview|responsebody|errorbody|request_payload|prompt|content|contents|parts|messages|image|images|data|input|output)(\\.|$$)")
                - replace_pattern(body, "(?i)\\b(Bearer|Basic)\\s+[^\\s\"'<>]+", "$$1 [REDACTED]")
                - replace_pattern(body, "(?i)\\b(sk-[a-z0-9_-]{8,}|AIza[a-z0-9_-]{15,})\\b", "[REDACTED]")
                - replace_pattern(body, "(?i)((api[_-]?key|token|password|secret|signature|credential)[\"']?\\s*[:=]\\s*[\"']?)[^\\s&#\"',}]+", "$$1[REDACTED]")
                - replace_pattern(body, "(?i)([a-z][a-z0-9+.-]*://)[^\\s/@]+:[^\\s/@]+@", "$$1[REDACTED]@")
                - replace_pattern(body, "(?i)data:[^;\\s]+;base64,[a-z0-9+/=]+", "[BINARY REDACTED]")
                - replace_all_patterns(attributes, "value", "(?i)\\b(Bearer|Basic)\\s+[^\\s\"'<>]+", "$$1 [REDACTED]")
                - replace_all_patterns(attributes, "value", "(?i)\\b(sk-[a-z0-9_-]{8,}|AIza[a-z0-9_-]{15,})\\b", "[REDACTED]")
                - replace_all_patterns(attributes, "value", "(?i)((api[_-]?key|token|password|secret|signature|credential)[\"']?\\s*[:=]\\s*[\"']?)[^\\s&#\"',}]+", "$$1[REDACTED]")
                - replace_all_patterns(attributes, "value", "(?i)([a-z][a-z0-9+.-]*://)[^\\s/@]+:[^\\s/@]+@", "$$1[REDACTED]@")
                - replace_all_patterns(attributes, "value", "(?i)data:[^;\\s]+;base64,[a-z0-9+/=]+", "[BINARY REDACTED]")
                # A labelled private field inside text (error messages, stacks, JSON embedded in a
                # string): everything from the label on goes, like redact-log.ts privateAssignment.
                - replace_pattern(body, "(?is)\\b(prompt|contents?|messages|parts|payload|request_payload|responsebody|errorbody|body|input|output)([\"']?\\s*[:=]).*$$", "$$1$$2 [REDACTED PAYLOAD]")
                - replace_all_patterns(attributes, "value", "(?is)\\b(prompt|contents?|messages|parts|payload|request_payload|responsebody|errorbody|body|input|output)([\"']?\\s*[:=]).*$$", "$$1$$2 [REDACTED PAYLOAD]")
                - set(body, Substring(body, 0, 16000)) where Len(body) > 16000
                - truncate_all(attributes, 4000)
                # OpenObserve has no row id; Admin pages, cursors and context lookups key on this.
                - set(attributes["log_id"], UUID())
        resource:
          attributes:
            - key: deployment.environment.name
              value: $${env:OBS_DEPLOYMENT}
              action: upsert
        batch:
          send_batch_size: 2048
          send_batch_max_size: 2048
          timeout: 2s
      exporters:
        otlp_http/openobserve:
          endpoint: http://openobserve:5080/api/$${env:OBS_ORG}
          auth:
            authenticator: basicauth/openobserve
          headers:
            stream-name: app
          sending_queue:
            enabled: true
            storage: file_storage/queue
            # Counted in bytes: at most 256 MB on disk (otel-queue) per pipeline, logs and traces
            # each, while OpenObserve is away. Past that new data is refused rather than the disk
            # filled.
            sizer: bytes
            queue_size: 268435456
          retry_on_failure:
            enabled: true
            max_elapsed_time: 0
      service:
        extensions: [health_check, file_storage/queue, basicauth/openobserve]
        telemetry:
          logs:
            level: warn
        pipelines:
          logs:
            receivers: [fluent_forward]
            processors: [memory_limiter, transform/logs, resource, batch]
            exporters: [otlp_http/openobserve]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [otlp_http/openobserve]

volumes:
  log-buffer:
  openobserve-data:
  otel-queue:

networks:
  application:
  application-infra:
    external: true
    name: ${INFRA_NETWORK_NAME:-image-playground-infra}
