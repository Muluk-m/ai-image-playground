resolver 127.0.0.11 valid=10s ipv6=off;
set $bff_upstream http://bff:37377;

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location /api {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_address;
    proxy_set_header X-Forwarded-For $canonical_client_address;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass $bff_upstream;
}

# Queue submits carry base64 input images, compressed by the client to a 2048 px long edge.
# Match the BFF's own 100 MiB body limit (and Cloudflare's) only on the submit route.
location ~ ^/v1/queue/[^/]+/[^/]+/submit$ {
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_address;
    proxy_set_header X-Forwarded-For $canonical_client_address;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 960s;
    proxy_send_timeout 960s;
    proxy_pass $bff_upstream;
}

# Queue clients already use /v1/queue. Proxy the complete /v1 API namespace
# without rewriting the URI so those public HTTP shapes remain unchanged.
location /v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $canonical_client_address;
    proxy_set_header X-Forwarded-For $canonical_client_address;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 960s;
    proxy_send_timeout 960s;
    proxy_pass $bff_upstream;
}

location = /health {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass $bff_upstream;
}
