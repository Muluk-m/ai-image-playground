# Production ingress is restricted to the host domain proxy on the private edge network.
# That proxy must overwrite X-Forwarded-For with one canonical client address. Direct,
# loopback-only deployments fall back to the socket peer; forwarded chains are rejected.
map $http_x_forwarded_for $canonical_client_address {
    default $http_x_forwarded_for;
    "" $remote_addr;
    ~, $remote_addr;
}

# Empty Upgrade stays a normal request. A websocket handshake keeps the upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /app/deploy/nginx.proxy.conf;

    location = /runtime-config.json {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # 容器形态不产出 version.json；显式 404 好过让 SPA fallback 回一份 index.html。
    location = /version.json {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location = /assets/ { return 301 /assets; }
    location = /image { return 301 /$is_args$args; }
    location = /image/ { return 301 /$is_args$args; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /inspiration-manifest.json {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }


    location ~ ^/(?:workbench|explore|assets|tools|projects|pricing|terms|privacy|p/[^/]+)/?$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /workbench.html;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
