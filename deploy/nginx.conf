server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff_upstream http://bff:37377;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /runtime-config.json {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /inspiration-manifest.json {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location /api {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $bff_upstream;
    }

    # Queue submits carry base64 input images. Allow the 512 MiB client payload
    # ceiling plus mask and JSON envelope overhead only on the submit route.
    location ~ ^/v1/queue/[^/]+/[^/]+/submit$ {
        client_max_body_size 600m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
        proxy_pass $bff_upstream;
    }

    # Queue clients already use /v1/queue. Proxy the complete /v1 API namespace
    # without rewriting the URI so those public HTTP shapes remain unchanged.
    location /v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
        proxy_pass $bff_upstream;
    }

    location = /health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass $bff_upstream;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
