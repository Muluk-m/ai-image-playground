services:
  postgres:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the external environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the external environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the external environment file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - application-infra
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=127.0.0.1 --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  postgres-provision:
    image: postgres:17.6-alpine3.22
    profiles:
      - provision
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the external environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the external environment file}
      POSTGRES_APP_DATABASE: ${POSTGRES_APP_DATABASE:-}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      POSTGRES_EXTRA_SCHEMAS: ${POSTGRES_EXTRA_SCHEMAS:-}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        : "$${POSTGRES_APP_DATABASE:?Set POSTGRES_APP_DATABASE for provision}"
        : "$${POSTGRES_MIGRATOR_USER:?Set POSTGRES_MIGRATOR_USER for provision}"
        : "$${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD for provision}"
        : "$${POSTGRES_APP_USER:?Set POSTGRES_APP_USER for provision}"
        : "$${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD for provision}"
        : "$${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER for provision}"
        : "$${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD for provision}"
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql --host=postgres --username="$${POSTGRES_USER}" --dbname=postgres \
          --set=ON_ERROR_STOP=1 \
          --set=app_database="$${POSTGRES_APP_DATABASE}" \
          --set=migrator_user="$${POSTGRES_MIGRATOR_USER}" \
          --set=migrator_password="$${POSTGRES_MIGRATOR_PASSWORD}" \
          --set=app_user="$${POSTGRES_APP_USER}" \
          --set=app_password="$${POSTGRES_APP_PASSWORD}" \
          --set=admin_user="$${POSTGRES_ADMIN_USER}" \
          --set=admin_password="$${POSTGRES_ADMIN_PASSWORD}" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'migrator_user', :'migrator_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'migrator_user') \gexec
        SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'migrator_user', :'migrator_password') \gexec
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user') \gexec
        SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password') \gexec
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'admin_user', :'admin_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'admin_user') \gexec
        SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'admin_user', :'admin_password') \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'app_database', :'migrator_user')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'app_database') \gexec
        SELECT format('ALTER DATABASE %I OWNER TO %I', :'app_database', :'migrator_user') \gexec
        \connect :"app_database"
        SELECT format('REASSIGN OWNED BY %I TO %I', :'app_user', :'migrator_user') \gexec
        REVOKE CREATE ON SCHEMA public FROM PUBLIC;
        SELECT format('REVOKE CREATE ON SCHEMA public FROM %I', :'app_user') \gexec
        SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'app_database', :'app_user') \gexec
        SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'app_database', :'admin_user') \gexec
        SELECT format('GRANT USAGE ON SCHEMA public TO %I', :'app_user') \gexec
        SELECT format('GRANT USAGE ON SCHEMA public TO %I', :'admin_user') \gexec
        SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO %I', :'app_user') \gexec
        SELECT format('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO %I', :'app_user') \gexec
        SELECT format('GRANT SELECT ON ALL TABLES IN SCHEMA public TO %I', :'admin_user') \gexec
        SELECT format('GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO %I', :'admin_user') \gexec
        SELECT format(
          'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I',
          :'migrator_user',
          :'app_user'
        ) \gexec
        SELECT format(
          'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO %I',
          :'migrator_user',
          :'app_user'
        ) \gexec
        SELECT format(
          'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT SELECT ON TABLES TO %I',
          :'migrator_user',
          :'admin_user'
        ) \gexec
        SELECT format(
          'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT SELECT ON SEQUENCES TO %I',
          :'migrator_user',
          :'admin_user'
        ) \gexec
        SQL
        set -f
        IFS=','
        for schema in $${POSTGRES_EXTRA_SCHEMAS}; do
          [ -n "$${schema}" ] || continue
          case "$${schema}" in
            [!a-z_]* | *[!a-z0-9_]*)
              echo "POSTGRES_EXTRA_SCHEMAS: '$${schema}' is not a valid schema name" >&2
              exit 1
              ;;
          esac
        done
        # The migrations create these schemas themselves on first run. Creating them here first is
        # what lets the migrator own them and the grants exist before any table does. The Admin
        # role must read them because pg_dump locks every table; the application role gets nothing.
        for schema in drizzle $${POSTGRES_EXTRA_SCHEMAS}; do
          [ -n "$${schema}" ] || continue
          psql --host=postgres --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_APP_DATABASE}" \
            --set=ON_ERROR_STOP=1 \
            --set=migrator_user="$${POSTGRES_MIGRATOR_USER}" \
            --set=admin_user="$${POSTGRES_ADMIN_USER}" \
            --set=schema="$${schema}" <<'SQL'
        SELECT format('CREATE SCHEMA IF NOT EXISTS %I AUTHORIZATION %I', :'schema', :'migrator_user') \gexec
        SELECT format('GRANT USAGE ON SCHEMA %I TO %I', :'schema', :'admin_user') \gexec
        SELECT format('GRANT SELECT ON ALL TABLES IN SCHEMA %I TO %I', :'schema', :'admin_user') \gexec
        SELECT format('GRANT SELECT ON ALL SEQUENCES IN SCHEMA %I TO %I', :'schema', :'admin_user') \gexec
        SELECT format(
          'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT SELECT ON TABLES TO %I',
          :'migrator_user',
          :'schema',
          :'admin_user'
        ) \gexec
        SELECT format(
          'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT SELECT ON SEQUENCES TO %I',
          :'migrator_user',
          :'schema',
          :'admin_user'
        ) \gexec
        SQL
        done
        unset IFS
        set +f
        # One unreadable object fails the whole nightly pg_dump, and nothing reports it until the
        # backup does, a day later. Name it here instead.
        psql --host=postgres --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_APP_DATABASE}" \
          --set=ON_ERROR_STOP=1 \
          --set=admin_user="$${POSTGRES_ADMIN_USER}" <<'SQL'
        WITH unreadable AS (
          SELECT quote_ident(nspname) AS name
          FROM pg_namespace
          WHERE nspname NOT LIKE 'pg\_%'
            AND nspname <> 'information_schema'
            AND NOT has_schema_privilege(:'admin_user', nspname, 'USAGE')
          UNION
          SELECT format('%I.%I', schemaname, tablename)
          FROM pg_tables
          WHERE schemaname NOT LIKE 'pg\_%'
            AND schemaname <> 'information_schema'
            AND NOT has_table_privilege(:'admin_user', format('%I.%I', schemaname, tablename), 'SELECT')
        )
        SELECT format(
          'DO $$do$$ BEGIN RAISE EXCEPTION ''the Admin role cannot read %%. Add the schema to POSTGRES_EXTRA_SCHEMAS and rerun provision, or the daily pg_dump fails.'', %L; END $$do$$',
          string_agg(name, ', ' ORDER BY name)
        )
        FROM unreadable
        HAVING count(*) > 0 \gexec
        SQL
    networks:
      - application-infra

volumes:
  postgres-data:

networks:
  application-infra:
    name: ${INFRA_NETWORK_NAME:?Set INFRA_NETWORK_NAME in the external environment file}
    internal: true
