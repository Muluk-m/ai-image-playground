# The EdgeTAM segmenter, one instance per line: `test` (test releases only) and `prod` (production
# releases only, shared by internal and paid). Each is its own compose project, like infra, so no
# single app project owns it and redeploying one edition never restarts it for the others, while a
# test release can never touch what production calls. See deploy/segmenter/README.md.
#
# Stateless: no env file, no database, no provider credential, no published port, read-only root.
# It is reachable only on the app networks it is attached to: scripts/segmenter-deploy.sh connects
# it to `<project>_application` of each edition that uses it, with the alias `segmenter`, so every
# edition calls http://segmenter:8080 while the editions stay unable to reach each other.
name: image-playground-segmenter-${SEGMENTER_INSTANCE:?SEGMENTER_INSTANCE is set by scripts/segmenter-deploy.sh}

services:
  segmenter:
    image: ${SEGMENTER_IMAGE:?SEGMENTER_IMAGE is set by scripts/segmenter-deploy.sh}
    container_name: image-playground-segmenter-${SEGMENTER_INSTANCE}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # One request at a time, the model unloaded after 10 idle minutes; about 360 MB when loaded.
    mem_limit: 900m
    memswap_limit: 900m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - segmenter

networks:
  # Its own network only; it needs no egress (the weights are in the image).
  segmenter:
    name: image-playground-segmenter-${SEGMENTER_INSTANCE}
    internal: true
