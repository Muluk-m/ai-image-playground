name: Parallel issue validation
on:
  push:
    branches: [implement/parallel-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        issue: [1373]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aip_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_test
      BUN_TEST_JOBS: 4
      VITEST_MAX_WORKERS: 2
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: implement/issue-${{ matrix.issue }}
      - name: Record exact source revision
        run: git rev-parse HEAD | tee validation-sha.txt
      - uses: ./.github/actions/setup
      - name: Format and sort imports
        run: pnpm exec biome check --write .
      - name: Capture formatting changes
        if: always()
        run: git diff --binary > validation-format.patch
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --concurrency=1 --env-mode=loose
      - run: pnpm --dir apps/web build:static-host
        env:
          BFF_ENABLED: 'true'
          BFF_BASE_URL: https://startup-api.invalid
      - uses: ./.github/actions/pages-browser
        with:
          label: issue-${{ matrix.issue }}
          test-runner: 'true'
      - name: Load disposable smoke harness
        if: matrix.issue == 1365
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .validation-harness
      - name: Exercise persisted storyboard tool
        if: matrix.issue == 1365
        run: |
          cp .validation-harness/.github/issue-1365-smoke.ts apps/bff/.issue-1365-smoke.ts
          trap 'rm -f apps/bff/.issue-1365-smoke.ts' EXIT
          bun apps/bff/.issue-1365-smoke.ts | tee validation-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-${{ matrix.issue }}-validation
          path: |
            validation-sha.txt
            validation-format.patch
            apps/web/dist
            validation-smoke.json
          retention-days: 7
