name: Web checks
on:
  pull_request:
  push:
    # test 是测试环境分支（.github/workflows/test-preview.yml）。它跑 CI，但不会触发
    # 生产发布：deploy.yml 的 workflow_run 只接 branches: [main]。
    branches: [main, test]
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --dir apps/web build
  bff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aip_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_test
      VITEST_MAX_WORKERS: 1
      # Node 24.18 exposes an unconfigured global localStorage; jsdom owns browser storage here.
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --concurrency=1 --env-mode=loose
  # 收费版是公开 main 最重要的消费者，这一步给它投票权：候选公开树 + 已知可用的 overlay
  # （`verified`，不是可能在途的 main）一起 lint / typecheck / build。它执行的是「先扩后缩」——
  # 公开树只能删掉 verified overlay 已经不再引用的宿主面成员；反向 boundary 检查则确保
  # overlay 只经由 private-host / private-overlay 引公开树（scripts/check-private-boundary.ts）。
  #
  # 需要 PRIVATE_OVERLAY_SSH_KEY，fork 的 PR 拿不到 secrets，跳过；主仓 PR 与 main/test push 都跑。
  with-overlay:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `actions/checkout` 的 `repository` 要 `owner/repo` 形式，不是 SSH URL。
      PRIVATE_OVERLAY_REPO: Muluk-m/ai-image-playground-private
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 先自己报一句：`ssh-key` 为空时 checkout 会退回 token 认证，私有仓返回的是
      # 「Repository not found」，看不出真因是密钥没配。
      - name: Require the overlay key
        env:
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
        run: |
          [ -n "$PRIVATE_OVERLAY_SSH_KEY" ] || { echo "::error::PRIVATE_OVERLAY_SSH_KEY is missing."; exit 1; }
      # 与 `deploy.yml` 同一条路子：`actions/checkout` 把 github.com 的 host key 硬编码在
      # 源码里，这一步不碰任何网络接口。别改回手搓 `git clone` + 匿名调
      # `api.github.com/meta` 取 known_hosts——那个接口限额 60 次/小时且按发起 IP 计，而
      # runner 出口 IP 是共享的，2026-09-22 生产部署就是这么被一个 403 整条挂掉的。
      # 调研见 `docs/research/deploy-known-hosts-and-overlay-coupling.md`。
      - name: Check out the private overlay at its verified pointer
        id: overlay
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: verified
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      - name: Record the overlay commit
        run: echo "overlay=${{ steps.overlay.outputs.commit }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --dir apps/web build
