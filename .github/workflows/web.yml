name: Web checks
on:
  pull_request:
  push:
    # test 是测试环境分支（发布见 .github/workflows/deploy-test.yml）。它跑 CI，但不会触发
    # 生产发布：deploy.yml 的 workflow_run 只接 branches: [main]。
    branches: [main, test]
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # 合并到 main 的提交若与它的 PR 最后一次通过的 Web checks 是同一棵树，下面四个 job 已经在
  # 那次跑过，main 上不再重跑，直接交给部署。PR 落后于 main（合并后树不同）、来自 fork、或找不到
  # 通过的那次，都照常全跑。
  prior:
    name: Already checked in the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -u
          # 查不到、查询失败都按「没验证过」处理：照常全跑，绝不因为这一步出错而跳过检查。
          verified=false
          check() {
            [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] || return 0
            pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"main\" and .head.repo.full_name == \"$REPO\")][0] // empty") || return 1
            [ -n "$pr" ] || { echo "::notice::No merged pull request for $SHA; running every check."; return 0; }
            head=$(printf '%s' "$pr" | jq -er .head.sha) || return 1
            number=$(printf '%s' "$pr" | jq -er .number) || return 1
            tree=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha) || return 1
            head_tree=$(gh api "repos/$REPO/commits/$head" --jq .commit.tree.sha) || return 1
            passed=$(gh api "repos/$REPO/actions/workflows/web.yml/runs?event=pull_request&head_sha=$head&status=success" \
              --jq '.total_count') || return 1
            if [ -n "$tree" ] && [ "$tree" = "$head_tree" ] && [ "${passed:-0}" -gt 0 ]; then
              verified=true
              echo "::notice::Same tree as PR #$number head $head, which passed Web checks; skipping the rerun."
            else
              echo "::notice::PR #$number: tree match=$([ "$tree" = "$head_tree" ] && echo yes || echo no), passed runs=${passed:-0}; running every check."
            fi
          }
          check || { verified=false; echo "::warning::Could not read the pull request history; running every check."; }
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
  web:
    needs: prior
    if: needs.prior.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: python3 scripts/test-cloud-test.py
      - run: node --test scripts/__tests__/lock-closure-changed.test.mjs scripts/__tests__/test-guard.test.mjs
      - run: pnpm lint
      # The production Dockerfile rebuilds the web package from an allowlisted context.
      # Run the same web stage when build inputs change, so missing .dockerignore entries
      # fail in CI instead of blocking a later production deployment.
      - name: Detect Docker web build changes
        id: docker-web-context
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          [ -n "$base" ] || base="$(git rev-parse HEAD^)"
          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '(^Dockerfile$|^\.dockerignore$|(^|/)vite\.config\.(ts|js|mjs|cjs)$|^scripts/)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Docker web stage
        if: steps.docker-web-context.outputs.required == 'true'
        run: docker buildx build --progress=plain --target web-build --build-arg TARGETARCH=amd64 --build-arg PRIVATE_OVERLAY_PRESENT=false .
      # Deploy and backup scripts; shellcheck ships on the hosted runner.
      - run: pnpm lint:sh
      - run: pnpm typecheck
      - run: pnpm --dir apps/web build:static-host
        env:
          BFF_ENABLED: 'true'
          BFF_BASE_URL: https://startup-api.invalid
      - uses: ./.github/actions/pages-browser
        with:
          label: startup-public
          test-runner: 'true'
      - run: pnpm --dir apps/admin build
  # 带数据库的测试拆成两台机器：bff 的 Bun 套件（最长，约 3 分钟）单独一台，其余包（shared、db、
  # node-kit、admin、website，合计约 1.5 分钟）另一台。不在同一台机器上叠并发：shared 里有按耗时
  # 断言的用例，和别的包抢 CPU 会超时（PR #1458 第一轮 --concurrency=3 就这样挂过）。
  # 本机的 `pnpm test` 仍是一次一个包（package.json 不变）。
  bff:
    needs: prior
    if: needs.prior.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: bff
            filter: "--filter=@image-playground/bff"
          - name: packages
            filter: "--filter=!@image-playground/web --filter=!@image-playground/bff"
    name: bff (${{ matrix.part.name }})
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aip_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_test
      VITEST_MAX_WORKERS: 1
      # 数据库测试一个文件一个进程、一个 suite 一个库，可以并发跑（scripts/run-bun-tests-isolated.ts）。
      BUN_TEST_JOBS: 4
      # Node 24.18 exposes an unconfigured global localStorage; jsdom owns browser storage here.
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # typecheck 在 web job 里跑过，这里不重复；web 的 vitest 在 web-test job 并行跑。
      - run: pnpm test --concurrency=1 --env-mode=loose ${{ matrix.part.filter }}
  # apps/web 的 vitest 不需要数据库，也是最长的一段；独立出来与 bff job 并行，不再串在它后面。
  # 409 个文件约 3-4 分钟，按 vitest --shard 分到两台机器。
  web-test:
    needs: prior
    if: needs.prior.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: web-test (${{ matrix.shard }}/2)
    env:
      # Its own 4-vCPU runner, so two workers; the bff job keeps 1 beside its Bun suites.
      VITEST_MAX_WORKERS: 2
      # Node 24.18 exposes an unconfigured global localStorage; jsdom owns browser storage here.
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm test --env-mode=loose --filter=@image-playground/web -- --shard=${{ matrix.shard }}/2
  # 收费版是公开 main 最重要的消费者，这一步给它投票权：候选公开树 + `private.lock` 钉住的
  # overlay 一起 lint / typecheck / build，并跑 overlay 自己的测试。它执行的是「先扩后缩」——公开树只能删掉钉住的
  # overlay 已经不再引用的宿主面成员；反向 boundary 检查则确保
  # overlay 只经由 private-host / private-overlay 引公开树（scripts/check-private-boundary.ts）。
  #
  # 需要 PRIVATE_OVERLAY_SSH_KEY，fork 的 PR 拿不到 secrets，跳过；主仓 PR 与 main/test push 都跑。
  with-overlay:
    needs: prior
    if: >-
      needs.prior.outputs.verified != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aip_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `actions/checkout` 的 `repository` 要 `owner/repo` 形式，不是 SSH URL。
      PRIVATE_OVERLAY_REPO: Muluk-m/ai-image-playground-private
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_test
      BUN_TEST_JOBS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # 先自己报一句：`ssh-key` 为空时 checkout 会退回 token 认证，私有仓返回的是
      # 「Repository not found」，看不出真因是密钥没配。
      - name: Require the overlay key
        env:
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
        run: |
          [ -n "$PRIVATE_OVERLAY_SSH_KEY" ] || { echo "::error::PRIVATE_OVERLAY_SSH_KEY is missing."; exit 1; }
      # 与 `deploy.yml` 同一条路子：`actions/checkout` 把 github.com 的 host key 硬编码在
      # 源码里，这一步不碰任何网络接口。别改回手搓 `git clone` + 匿名调
      # `api.github.com/meta` 取 known_hosts——那个接口限额 60 次/小时且按发起 IP 计，而
      # runner 出口 IP 是共享的，2026-09-22 生产部署就是这么被一个 403 整条挂掉的。
      # 调研见 `docs/research/deploy-known-hosts-and-overlay-coupling.md`。
      - name: Read the pinned overlay commit
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < private.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the private overlay at the pinned commit
        id: overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ steps.lock.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      - name: Record the overlay commit
        run: echo "overlay=${{ steps.overlay.outputs.commit }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --dir apps/web build:static-host
        env:
          BFF_ENABLED: 'true'
          BFF_BASE_URL: https://startup-api.invalid
      - uses: ./.github/actions/pages-browser
        with:
          label: startup-paid
      - run: pnpm --dir apps/admin build
      # 计费钩子的测试在 overlay 里。公开 PR 改了钩子而私有测试红，原本要等合并后 overlay CI
      # 才发现（verified 指针停住）；这里在合并前就拦下。
      # 逐包串行，每包内由 BUN_TEST_JOBS 并发，避免进程数叠乘。
      - run: pnpm --filter './private/apps/*' --workspace-concurrency=1 test
