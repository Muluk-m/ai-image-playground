name: CodeQL
# 代码扫描（JS/TS 与 GitHub Actions 工作流），结果在 Security → Code scanning，PR 上会显示新增告警。
# 只报告、不拦合并：main 没有必需检查，这个 job 失败或有告警都不阻止合并。
# 新增或未关闭的 high / critical 告警在评审里按「严重」算（REVIEW.md「什么算严重」）。
# 它不属于 Web checks，不影响 deploy.yml 的触发。公开仓库的 CodeQL 与 Actions 用量免费。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
