name: CodeQL
# 代码扫描（JS/TS 与 GitHub Actions 工作流），结果在 Security → Code scanning，PR 上会显示新增告警。
# 只报告、不拦合并：main 没有必需检查，这个 job 失败或有告警都不阻止合并。
# 新增或未关闭的 high / critical 告警在评审里按「严重」算（REVIEW.md「什么算严重」）。
# 它不属于 Web checks，不影响 deploy.yml 的触发。公开仓库的 CodeQL 与 Actions 用量免费。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
