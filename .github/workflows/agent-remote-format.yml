name: Agent remote formatting
on:
  push:
    branches: [verify/auth-root-canvas-format]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - run: pnpm exec biome check --write .
      - name: Capture formatter patch
        if: always()
        run: git diff --binary > "$RUNNER_TEMP/formatting.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: formatting-patch
          path: ${{ runner.temp }}/formatting.patch
          retention-days: 1
