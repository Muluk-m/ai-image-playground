name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Trust auth keeps a literal password out of this file. The service is reachable
          # only from this job's own container network.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # packages/db/src/testing.ts refuses anything but a loopback host whose database name
      # contains "test", connects to /postgres as admin, and creates one database per test file.
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_test

    steps:
      - uses: actions/checkout@v5

      # The overlay compiles in by mere file presence, so a public build log could leak its
      # paths. Nothing here may ever produce a paid bundle.
      - name: Assert the private overlay is absent
        run: test ! -e private

      # No version input: the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      # pnpm lint shells out to bun, and every BFF/Admin/db test is bun:test.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: shellcheck
        run: shellcheck -s sh -x --severity=warning scripts/*.sh scripts/lib/*.sh
