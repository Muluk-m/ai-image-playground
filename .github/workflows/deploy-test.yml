# Test environment: every push to `test` is checked, then released to test.muvloom.online.
# The backend and Pages targets are guarded against production resource reuse.
# Production remains deploy.yml.
# Runbook: docs/deploy/test-environment.md.
name: Deploy test
on:
  push:
    branches: [test]
  workflow_dispatch:
permissions:
  contents: read
# One test deployment at a time: the whole run holds the group, so a rollout is never cancelled
# and two runs' backend/publish never interleave. GitHub keeps only the newest waiting run, so a
# burst of pushes is the running one plus the latest. The `superseded` job below cancels the
# running one while it is still in its gates once a newer push lands, so the newest starts sooner.
concurrency:
  group: test-deploy
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  # `actions/checkout` 的 `repository` 要 `owner/repo` 形式，不是 SSH URL。
  PRIVATE_OVERLAY_REPO: Muluk-m/ai-image-playground-private
jobs:
  # A newer push to `test` waits in the group above. While this run is still in its gates, stop
  # it so the newest push is checked next; once every gate has finished (the rollout may start),
  # leave it alone. The image build comes before any VPS change, so the narrow race between the
  # last status read and the cancel can at most stop the build, never a rollout.
  superseded:
    name: Stop when a newer push arrives
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          gates='(Checks|Tests \(|Web tests \(|Paid build checks|Paid overlay tests)'
          while :; do
            sleep 30
            # Any read that fails just waits for the next round; this job never cancels on doubt.
            jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | "\(.status) \(.name)"') || continue
            # The rollout job has started (or finished): never cancel from here on.
            if grep -Eq '^(in_progress|completed) Backend images' <<<"$jobs"; then exit 0; fi
            gate=$(grep -E "^[a-z_]+ $gates" <<<"$jobs" || true)
            [ -n "$gate" ] || continue
            if ! grep -qv '^completed ' <<<"$gate"; then exit 0; fi
            tip=$(gh api "repos/$REPO/git/ref/heads/test" --jq .object.sha) || continue
            if [ -n "$tip" ] && [ "$tip" != "$SHA" ]; then
              echo "test moved to $tip; cancelling this run before its rollout."
              gh run cancel "$RUN_ID" -R "$REPO" || true
              exit 0
            fi
          done

  # The gate before the rollout is five jobs running side by side, the same split web.yml uses:
  # public lint/build/startup (checks), the database-backed suites (tests, two runners), the web
  # vitest (web-tests, two shards), the paid build with the pinned overlay (paid-checks) and the
  # overlay's own tests (paid-tests). The rollout job used to rerun the paid half itself after
  # Checks had finished; it now waits for all five instead.
  # Local `pnpm test` keeps running one package at a time; only these CI commands are parallel.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit that triggered this run, not the branch tip: a push landing mid-run would
          # otherwise be published by a job that never checked it.
          ref: ${{ github.sha }}
          # ci-check-test-branch.sh compares against origin/main, so it needs the full history.
          fetch-depth: 0
          persist-credentials: false
      # `workflow_dispatch` can be started from any branch; only `test` may reach the test site.
      - name: Require the test branch
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/test ] ||
            { echo "::error::Deploy test only runs on refs/heads/test, not $REF."; exit 1; }
      # First, because the rest of this run is wasted on a branch that is behind main. The run
      # fails here rather than merging: resolving a conflict unattended is how a test site ends
      # up running something that exists nowhere else. Merge main into test and push again.
      - run: scripts/ci-check-test-branch.sh origin
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      # The same build the release job runs, failing here instead of half way through an upload.
      - run: pnpm --dir apps/web build:static-host
        env:
          BFF_ENABLED: 'true'
          BFF_BASE_URL: https://startup-api.invalid
      - uses: ./.github/actions/pages-browser
        with:
          label: test-startup-public
      - run: pnpm --dir apps/admin build

  # Same split as web.yml: bff's Bun suites on one runner, the other packages on another, and the
  # web vitest sharded across two. Nothing stacks extra concurrency on one machine: a timing test
  # in shared times out when it competes for CPU (PR #1458, first attempt).
  tests:
    name: Tests (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: bff
            filter: "--filter=@image-playground/bff"
          - name: packages
            filter: "--filter=!@image-playground/web --filter=!@image-playground/bff"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aip_test
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_test
      VITEST_MAX_WORKERS: 1
      # Every suite gets its own database, so files can run side by side (scripts/run-bun-tests-isolated.ts).
      BUN_TEST_JOBS: 4
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test --concurrency=1 --env-mode=loose ${{ matrix.part.filter }}

  web-tests:
    name: Web tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      VITEST_MAX_WORKERS: 2
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test --env-mode=loose --filter=@image-playground/web -- --shard=${{ matrix.shard }}/2

  paid-checks:
    name: Paid build checks
    # Holds the overlay key; never spend it on a dispatch from another branch (checks fails those).
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      private_sha: ${{ steps.overlay.outputs.commit }}
    steps:
      - name: Require the overlay key
        env:
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
        run: |
          [ -n "$PRIVATE_OVERLAY_SSH_KEY" ] || { echo "::error::Secrets empty or missing: PRIVATE_OVERLAY_SSH_KEY"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the pinned overlay commit
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < private.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the private overlay at the pinned commit
        id: overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ steps.lock.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --dir apps/web build:static-host
        env:
          BFF_ENABLED: 'true'
          BFF_BASE_URL: https://startup-api.invalid
      - uses: ./.github/actions/pages-browser
        with:
          label: test-startup-paid

  # The overlay's own tests (billing hooks and the rest of private/apps), the same command as
  # web.yml's with-overlay job. That job runs in another workflow, so the rollout could not wait
  # for it; this gate makes Deploy test wait for the same suites at the same pinned overlay.
  paid-tests:
    name: Paid overlay tests
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aip_test
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_test
      BUN_TEST_JOBS: 4
    outputs:
      private_sha: ${{ steps.overlay.outputs.commit }}
    steps:
      - name: Require the overlay key
        env:
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
        run: |
          [ -n "$PRIVATE_OVERLAY_SSH_KEY" ] || { echo "::error::Secrets empty or missing: PRIVATE_OVERLAY_SSH_KEY"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the pinned overlay commit
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < private.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the private overlay at the pinned commit
        id: overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ steps.lock.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      - uses: ./.github/actions/setup
      # One package at a time; BUN_TEST_JOBS runs files in parallel inside each package.
      - run: pnpm --filter './private/apps/*' --workspace-concurrency=1 test

  backend:
    name: Backend images and VPS rollout
    needs: [checks, tests, web-tests, paid-checks, paid-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      private_sha: ${{ steps.overlay.outputs.commit }}
    steps:
      - name: Require secrets
        env:
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          missing=
          for name in PRIVATE_OVERLAY_SSH_KEY VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS VPS_SSH_HOST VPS_SSH_USER; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Secrets empty or missing:$missing"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Pin the same overlay for image and Pages builds.
      - name: Read the pinned overlay commit
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < private.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the private overlay at the pinned commit
        id: overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ steps.lock.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      # Paid lint, typecheck, build and browser startup ran in paid-checks, and the overlay tests in
      # paid-tests, against this same
      # overlay commit (checked below); the image build itself only needs git and Docker, as in
      # deploy.yml.
      - name: Require the overlay the paid checks used
        env:
          CHECKED: ${{ needs.paid-checks.outputs.private_sha }}
          TESTED: ${{ needs.paid-tests.outputs.private_sha }}
          ACTUAL: ${{ steps.overlay.outputs.commit }}
        run: |
          [ -n "$CHECKED" ] && [ "$CHECKED" = "$ACTUAL" ] && [ "$TESTED" = "$ACTUAL" ] ||
            { echo "::error::Overlay $ACTUAL is not the commit paid-checks ($CHECKED) and paid-tests ($TESTED) verified."; exit 1; }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the release images
        id: build
        env:
          PUBLIC_SHA: ${{ github.sha }}
          PRIVATE_SHA: ${{ steps.overlay.outputs.commit }}
        run: |
          release_id="aip-$(printf %.12s "$PUBLIC_SHA")-$(printf %.12s "$PRIVATE_SHA")"
          ./scripts/build-vps-release.sh test "$RUNNER_TEMP/$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Ship the release to the VPS and roll it out
        env:
          RELEASE_ID: ${{ steps.build.outputs.release_id }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps-key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vps-known-hosts"
          # The key is bound to scripts/ci-receive.sh on the VPS; the command below is all it accepts.
          tar -C "$RUNNER_TEMP/$RELEASE_ID" -czf - . |
            ssh -i "$RUNNER_TEMP/vps-key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/vps-known-hosts" \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$VPS_SSH_USER@$VPS_SSH_HOST" "deploy $RELEASE_ID test $GITHUB_RUN_ID"
      - name: Remove the SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/vps-key"

  publish:
    name: Release test.muvloom.online
    needs: [checks, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require secrets
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          PAID_CLOUDFLARE_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
        run: |
          missing=
          for name in PAGES_ENV PAID_CLOUDFLARE_API_TOKEN PRIVATE_OVERLAY_SSH_KEY; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Secrets empty or missing:$missing"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Write pages.env with the CI token file
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          # The test project lives in the same Cloudflare account as the paid site.
          PAID_CLOUDFLARE_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
        run: |
          umask 077
          # pages-release.sh sources the token file, so only inert token characters are allowed.
          printf '%s\n' "$PAID_CLOUDFLARE_API_TOKEN" | grep -Eqx '[A-Za-z0-9_-]+' ||
            { echo "::error::PAID_CLOUDFLARE_API_TOKEN has unexpected characters."; exit 1; }
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$PAID_CLOUDFLARE_API_TOKEN" \
            > "$RUNNER_TEMP/TEST-cloudflare.env"
          # Later assignments win when the file is sourced: they replace workstation paths, and
          # they drop the operator assets and the update prompt the paid site releases with.
          {
            printf '%s\n' "$PAGES_ENV"
            echo "TEST_CLOUDFLARE_TOKEN_FILE=$RUNNER_TEMP/TEST-cloudflare.env"
            echo "TEST_BFF_BASE_URL=https://test-api.muvloom.online"
            echo "TEST_BFF_BASE_URLS_BY_ORIGIN="
            echo "TEST_EXTRA_ASSETS_DIR="
            echo "TEST_NOTIFY_UPDATE="
          } > "$RUNNER_TEMP/pages.env"
          echo "PAGES_ENV_FILE=$RUNNER_TEMP/pages.env" >> "$GITHUB_ENV"
      # Match the backend overlay exactly; both builds use the same checked source pair.
      #
      # 与生产一样用 `actions/checkout`：它把 github.com 的 host key 硬编码在源码里，不像
      # 手搓那版每次都去匿名调 `api.github.com/meta`（限额 60 次/小时且按发起 IP 计，runner
      # 出口 IP 共享）。调研见 `docs/research/deploy-known-hosts-and-overlay-coupling.md`。
      - name: Check out the private overlay at the backend commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ needs.backend.outputs.private_sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      # The overlay packages are workspace members; the install covers their dependencies too.
      - uses: ./.github/actions/setup
      - name: Require isolated test API and matching backend version
        env:
          PUBLIC_SHA: ${{ github.sha }}
          PRIVATE_SHA: ${{ needs.backend.outputs.private_sha }}
        run: |
          scripts/check-test-isolation.sh pages "$PAGES_ENV_FILE"
          # shellcheck source=/dev/null
          . "$PAGES_ENV_FILE"
          expected="$PUBLIC_SHA+$PRIVATE_SHA"
          for _attempt in $(seq 1 30); do
            actual=$(curl -fsS --max-time 10 "$TEST_BFF_BASE_URL/health" | jq -r .version) || actual=
            [ "$actual" != "$expected" ] || break
            sleep 10
          done
          [ "$actual" = "$expected" ] || { echo "::error::Test API is not serving the checked release"; exit 1; }
      - run: ./scripts/pages-release.sh test
      - uses: ./.github/actions/pages-browser
        with:
          target: https://test.muvloom.online
          live: 'true'
          label: test-startup-live
      - name: Save upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-upload-startup
          path: ~/.cache/ai-image-playground/playwright-1.58.2/results
          retention-days: 7
      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP"/*-cloudflare.env "$RUNNER_TEMP/pages.env"
