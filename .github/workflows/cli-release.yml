name: CLI release

# 打 cli-vX.Y.Z 标签前必须另获用户批准。PR 只构建 Actions artifacts，不建标签或 Release。
# 与 PR 共用 Go 测试、五平台原生安装冒烟和真实 skills-ref 校验，再上传校验过的同一批产物。
# 构建作业只读、不持久化令牌；只有发布作业拿得到写 Release 的权限，且不执行仓库代码。
on:
  push:
    tags: ['cli-v*']

concurrency:
  group: cli-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/cli-checks.yml
    permissions:
      contents: read
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: muvloom-dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "muvloom ${GITHUB_REF_NAME#cli-v}" \
            --notes "Native muvloom CLI ${GITHUB_REF_NAME#cli-v}. Install with cli-go/install/install.sh or install.ps1."
