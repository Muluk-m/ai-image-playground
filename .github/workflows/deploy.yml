# Production deployment: paid backend and Pages continue to release from main.
# The existing internal edition is frozen and is not touched by this workflow.
# Runbook, secrets and break-glass manual release: docs/deploy/image-release.md.
name: Deploy production
on:
  workflow_run:
    workflows: [Web checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One deployment at a time. A queued run waits; a newer queued run replaces it.
concurrency:
  group: production-deploy
  cancel-in-progress: false
# `shell: bash` runs steps with -eo pipefail; the implicit default has no pipefail, and the
# tar | ssh pipeline must fail when either side does.
defaults:
  run:
    shell: bash
env:
  # `actions/checkout` 的 `repository` 要 `owner/repo` 形式，不是 SSH URL。
  PRIVATE_OVERLAY_REPO: Muluk-m/ai-image-playground-private
jobs:
  target:
    name: Pick the commit
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      deploy_api: ${{ steps.decide.outputs.deploy_api }}
      deploy_pages: ${{ steps.decide.outputs.deploy_pages }}
      deploy_web: ${{ steps.decide.outputs.deploy_web }}
      deploy_admin: ${{ steps.decide.outputs.deploy_admin }}
    steps:
      - name: Require secrets
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
        run: |
          [ -n "$PAGES_ENV" ] || { echo "::error::Secret PAGES_ENV is empty or missing."; exit 1; }
      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          printf '%s\n' "$PAGES_ENV" > "$RUNNER_TEMP/pages.env"
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/pages.env"
          WEB_ORIGINS="$PAID_PUBLIC_ORIGIN" ADMIN_ORIGIN="${ADMIN_PUBLIC_ORIGIN:-}" \
            scripts/ci-deploy-target.sh "$SHA" "$EVENT" "$PAID_BFF_BASE_URL"

  release:
    name: Tag the release
    needs: target
    if: needs.target.outputs.deploy_api == 'true' || needs.target.outputs.deploy_pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.target.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - id: tag
        run: |
          version=$(scripts/next-release-version.sh)
          git tag "v${version}" "${{ needs.target.outputs.sha }}"
          git push origin "refs/tags/v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Tagged v${version}"


  backend:
    name: Backend images and VPS rollout (paid)
    needs: [target, release]
    if: needs.target.outputs.deploy_api == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      private_sha: ${{ steps.overlay.outputs.commit }}
      release_id: ${{ steps.build.outputs.release_id }}
    steps:
      - name: Require secrets
        env:
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          missing=
          for name in PRIVATE_OVERLAY_SSH_KEY VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS VPS_SSH_HOST VPS_SSH_USER; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Secrets empty or missing:$missing"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - name: Read the pinned overlay commit
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < private.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the private overlay at the pinned commit
        id: overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ steps.lock.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the release images
        id: build
        env:
          PUBLIC_SHA: ${{ needs.target.outputs.sha }}
          PRIVATE_SHA: ${{ steps.overlay.outputs.commit }}
          APP_RELEASE: ${{ needs.release.outputs.version }}
        run: |
          release_id="aip-$(printf %.12s "$PUBLIC_SHA")-$(printf %.12s "$PRIVATE_SHA")"
          ./scripts/build-vps-release.sh all "$RUNNER_TEMP/$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Keep the release for the paid rollout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vps-release
          path: ${{ runner.temp }}/${{ steps.build.outputs.release_id }}
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Ship the paid release to the VPS and roll it out
        env:
          RELEASE_ID: ${{ steps.build.outputs.release_id }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps-key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vps-known-hosts"
          tar -C "$RUNNER_TEMP/$RELEASE_ID" -czf - . |
            ssh -i "$RUNNER_TEMP/vps-key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/vps-known-hosts" \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$VPS_SSH_USER@$VPS_SSH_HOST" "deploy $RELEASE_ID paid $GITHUB_RUN_ID"
      - name: Remove the SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/vps-key"

  pages-paid:
    name: Pages (paid)
    needs: [target, release, backend]
    # !cancelled(): without a status function GitHub adds an implicit success(), which is false once
    # backend is skipped (a web-only change), so the paid site would never ship. Unlike always(), a
    # cancelled release still stops here.
    if: >-
      !cancelled() &&
      needs.target.outputs.deploy_web == 'true' &&
      needs.release.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EDITION: paid
    steps:
      - name: Require secrets
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          PAID_CLOUDFLARE_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
        run: |
          missing=
          for name in PAGES_ENV PRIVATE_OVERLAY_SSH_KEY PAID_CLOUDFLARE_API_TOKEN; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Secrets empty or missing:$missing"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - name: Write pages.env with the paid token file
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          PAID_CLOUDFLARE_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
        run: |
          umask 077
          printf '%s\n' "$PAID_CLOUDFLARE_API_TOKEN" | grep -Eqx '[A-Za-z0-9_-]+' ||
            { echo "::error::PAID_CLOUDFLARE_API_TOKEN has unexpected characters."; exit 1; }
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$PAID_CLOUDFLARE_API_TOKEN" > "$RUNNER_TEMP/PAID-cloudflare.env"
          {
            printf '%s\n' "$PAGES_ENV"
            echo "PAID_CLOUDFLARE_TOKEN_FILE=$RUNNER_TEMP/PAID-cloudflare.env"
            echo "ADMIN_CLOUDFLARE_TOKEN_FILE=$RUNNER_TEMP/PAID-cloudflare.env"
            echo "PAID_EXTRA_ASSETS_DIR=$GITHUB_WORKSPACE/private/pages-assets"
          } > "$RUNNER_TEMP/pages.env"
          echo "PAGES_ENV_FILE=$RUNNER_TEMP/pages.env" >> "$GITHUB_ENV"
      - name: Wait for the paid API
        if: needs.target.outputs.deploy_api == 'true'
        env:
          PUBLIC_SHA: ${{ needs.target.outputs.sha }}
          PRIVATE_SHA: ${{ needs.backend.outputs.private_sha }}
        run: |
          # shellcheck source=/dev/null
          . "$PAGES_ENV_FILE"
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            version=$(curl -fsS --max-time 10 "${PAID_BFF_BASE_URL%/}/health" 2>/dev/null |
              sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)
            [ "$version" = "$PUBLIC_SHA+$PRIVATE_SHA" ] && break
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::paid API reports '$version'"; exit 1; }
            sleep 10
          done
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
      - name: Read the pinned overlay commit
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < private.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the private overlay at the backend's commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ needs.backend.outputs.private_sha || steps.lock.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      - name: Require the paid site assets
        run: test -d private/pages-assets
      - run: pnpm install --frozen-lockfile
      - name: Release the paid site
        env:
          PAGES_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/pages-paid-build
          APP_RELEASE: ${{ needs.release.outputs.version }}
        run: ./scripts/pages-release.sh paid
      - name: Verify the paid workspace in Chromium
        run: |
          # shellcheck source=/dev/null
          . "$PAGES_ENV_FILE"
          PAGES_SMOKE_OUTPUT_DIR="$RUNNER_TEMP/pages-paid-live" sh scripts/pages-browser-smoke.sh "$PAID_PUBLIC_ORIGIN"
      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP"/*-cloudflare.env "$RUNNER_TEMP/pages.env"

  admin-pages:
    name: Pages (admin)
    needs: [target, release, backend, pages-paid]
    if: >-
      !cancelled() &&
      needs.target.outputs.deploy_admin == 'true' &&
      needs.release.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.pages-paid.result == 'success' || needs.pages-paid.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require secrets
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          PAID_CLOUDFLARE_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
        run: |
          missing=
          for name in PAGES_ENV PRIVATE_OVERLAY_SSH_KEY PAID_CLOUDFLARE_API_TOKEN; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Secrets empty or missing:$missing"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - name: Write pages.env with the Admin token file
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          PAID_CLOUDFLARE_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
        run: |
          umask 077
          printf '%s\n' "$PAID_CLOUDFLARE_API_TOKEN" | grep -Eqx '[A-Za-z0-9_-]+' ||
            { echo "::error::PAID_CLOUDFLARE_API_TOKEN has unexpected characters."; exit 1; }
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$PAID_CLOUDFLARE_API_TOKEN" > "$RUNNER_TEMP/PAID-cloudflare.env"
          {
            printf '%s\n' "$PAGES_ENV"
            echo "ADMIN_CLOUDFLARE_TOKEN_FILE=$RUNNER_TEMP/PAID-cloudflare.env"
          } > "$RUNNER_TEMP/pages.env"
          echo "PAGES_ENV_FILE=$RUNNER_TEMP/pages.env" >> "$GITHUB_ENV"
      - name: Skip unless the Admin cutover is configured
        id: cutover
        run: |
          # shellcheck source=/dev/null
          . "$PAGES_ENV_FILE"
          if [ -z "${ADMIN_PAGES_PROJECT:-}" ]; then
            echo "::notice::Admin Pages cutover is not configured; skipping the Admin release."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for the Admin API
        if: steps.cutover.outputs.enabled == 'true' && needs.target.outputs.deploy_api == 'true'
        env:
          PUBLIC_SHA: ${{ needs.target.outputs.sha }}
          PRIVATE_SHA: ${{ needs.backend.outputs.private_sha }}
        run: |
          # shellcheck source=/dev/null
          . "$PAGES_ENV_FILE"
          if [ -z "${ADMIN_BFF_BASE_URL:-}" ]; then
            echo "::notice::Admin API base URL is not configured; skipping the Admin API check."
            exit 0
          fi
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            version=$(curl -fsS --max-time 10 "${ADMIN_BFF_BASE_URL%/}/health" 2>/dev/null |
              sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)
            [ "$version" = "$PUBLIC_SHA+$PRIVATE_SHA" ] && exit 0
            [ "$(date +%s)" -lt "$deadline" ] ||
              { echo "::error::$ADMIN_BFF_BASE_URL/health reports '${version}', expected $PUBLIC_SHA+$PRIVATE_SHA"; exit 1; }
            sleep 10
          done
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.cutover.outputs.enabled == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.cutover.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        if: steps.cutover.outputs.enabled == 'true'
      - name: Read the pinned overlay commit
        if: steps.cutover.outputs.enabled == 'true'
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < private.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the private overlay at the backend's commit
        if: steps.cutover.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ needs.backend.outputs.private_sha || steps.lock.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      - if: steps.cutover.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Release the paid Admin site
        if: steps.cutover.outputs.enabled == 'true'
        env:
          APP_RELEASE: ${{ needs.release.outputs.version }}
        run: ./scripts/pages-release.sh admin
      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP"/*-cloudflare.env "$RUNNER_TEMP/pages.env"
