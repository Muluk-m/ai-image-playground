# Production deployment from main: one shared muvloom backend and one muvloom Pages project.
# 一个项目、多个域名：the enterprise domain is a second custom domain of the muvloom Pages project,
# with its own API hostname and a host-scoped noindex.
# Runbook, secrets and break-glass manual release: docs/deploy/image-release.md.
name: Deploy production
# 常规发布按窗口：北京时间 12:30、18:30、23:30（cron 为 UTC），只发当时 origin/main 的 tip，
# 且该提交在 main 上的 `Web checks` 必须已成功。workflow_dispatch 是紧急通道：全量重发，须填 reason。
on:
  schedule:
    - cron: '30 4,10,15 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 紧急发布原因（写入 job summary）
        type: string
        required: true
permissions:
  contents: read
# One deployment at a time. A queued run waits; a newer queued run replaces it.
concurrency:
  group: production-deploy
  cancel-in-progress: false
# `shell: bash` runs steps with -eo pipefail; the implicit default has no pipefail, and the
# tar | ssh pipeline must fail when either side does.
defaults:
  run:
    shell: bash
env:
  # `actions/checkout` 的 `repository` 要 `owner/repo` 形式，不是 SSH URL。
  PRIVATE_OVERLAY_REPO: Muluk-m/ai-image-playground-private
jobs:
  target:
    name: Pick the commit
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      deploy_api: ${{ steps.decide.outputs.deploy_api }}
      deploy_pages: ${{ steps.decide.outputs.deploy_pages }}
      deploy_web: ${{ steps.decide.outputs.deploy_web }}
      deploy_admin: ${{ steps.decide.outputs.deploy_admin }}
    steps:
      - name: Require secrets
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
        run: |
          [ -n "$PAGES_ENV" ] || { echo "::error::Secret PAGES_ENV is empty or missing."; exit 1; }
      - name: Record the emergency reason
        if: github.event_name == 'workflow_dispatch'
        env:
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "### 紧急发布（workflow_dispatch）"
            echo "- 触发人：$ACTOR"
            echo "- 原因：$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # 窗口发 checkout 当下 main 的 tip（排队期间 main 前进也不会丢窗口）；手动沿用触发时的提交。
      - id: sha
        env:
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = schedule ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          fi
      # 窗口只发 `Web checks` 已在 main 上成功的 tip；没跑完或失败就跳过本窗口（不报错）。
      # overlay-bump 用 GITHUB_TOKEN 推的 lock 提交不会触发 `Web checks`（它已先自己构建验证），
      # 这种仅改 private.lock 的提交逐层越过，看最近一个有检查记录的祖先。
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # success：有成功记录；running：无成功但有未完成；failure：只有失败；none：没有记录
          checks_state() {
            gh api "repos/$REPO/actions/workflows/web.yml/runs?head_sha=$1&event=push&branch=main&per_page=100" \
              --jq 'if any(.workflow_runs[]?; .status == "completed" and .conclusion == "success") then "success" elif any(.workflow_runs[]?; .status != "completed") then "running" elif (.workflow_runs | length) == 0 then "none" else "failure" end'
          }
          check_sha=$SHA
          state=
          # 连续的 overlay-bump 提交都没有 Web checks，逐层往前找
          while :; do
            if ! state=$(checks_state "$check_sha"); then
              state=unavailable
              break
            fi
            [ "$state" = none ] || break
            [ "$(git log -1 --format=%an "$check_sha")" = github-actions[bot] ] || break
            git log -1 --format=%s "$check_sha" | grep -q '^chore(overlay): pin ' || break
            [ "$(git diff --name-only "$check_sha^" "$check_sha")" = private.lock ] || break
            check_sha=$(git rev-parse "$check_sha^")
          done
          if [ "$state" != success ]; then
            echo "::notice::Web checks for $check_sha on main is '$state'; skipping this window."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - id: decide
        if: steps.gate.outputs.ok == 'true'
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          printf '%s\n' "$PAGES_ENV" > "$RUNNER_TEMP/pages.env"
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/pages.env"
          # The enterprise domain is served by the same Pages project, so the muvloom origin speaks for it.
          WEB_ORIGINS="$PAID_PUBLIC_ORIGIN" ADMIN_ORIGIN="${ADMIN_PUBLIC_ORIGIN:-}" \
            scripts/ci-deploy-target.sh "$SHA" "$EVENT" "$PAID_BFF_BASE_URL"

  release:
    name: Tag the release
    needs: target
    if: needs.target.outputs.deploy_api == 'true' || needs.target.outputs.deploy_pages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - id: tag
        run: |
          version=$(scripts/next-release-version.sh)
          git tag "v${version}" "${{ needs.target.outputs.sha }}"
          git push origin "refs/tags/v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Tagged v${version}"


  backend:
    name: Backend images and VPS rollout (muvloom)
    needs: [target, release]
    if: needs.target.outputs.deploy_api == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      private_sha: ${{ steps.overlay.outputs.commit }}
      release_id: ${{ steps.build.outputs.release_id }}
    steps:
      - name: Require secrets
        env:
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          missing=
          for name in PRIVATE_OVERLAY_SSH_KEY VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS VPS_SSH_HOST VPS_SSH_USER; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Secrets empty or missing:$missing"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - name: Read the pinned overlay commit
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < private.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the private overlay at the pinned commit
        id: overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ steps.lock.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the release images
        id: build
        env:
          PUBLIC_SHA: ${{ needs.target.outputs.sha }}
          PRIVATE_SHA: ${{ steps.overlay.outputs.commit }}
          APP_RELEASE: ${{ needs.release.outputs.version }}
        run: |
          release_id="aip-$(printf %.12s "$PUBLIC_SHA")-$(printf %.12s "$PRIVATE_SHA")"
          # muvloom uses the installed VPS target name paid.
          ./scripts/build-vps-release.sh paid "$RUNNER_TEMP/$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Keep the release for the muvloom rollout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vps-release
          path: ${{ runner.temp }}/${{ steps.build.outputs.release_id }}
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Ship the muvloom release to the VPS and roll it out
        env:
          RELEASE_ID: ${{ steps.build.outputs.release_id }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps-key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/vps-known-hosts"
          # 75 = the host deploy lock is busy and nothing was changed. The script waits only while
          # the other environment's CI deploy holds it; any other holder still fails at once.
          VPS_KEY_FILE="$RUNNER_TEMP/vps-key" VPS_KNOWN_HOSTS_FILE="$RUNNER_TEMP/vps-known-hosts" \
            ./scripts/ci-ship-release.sh "$RUNNER_TEMP/$RELEASE_ID" paid "$GITHUB_RUN_ID"
      - name: Remove the SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/vps-key"

  pages-muvloom:
    name: Pages (muvloom project, every product domain)
    needs: [target, release, backend]
    # !cancelled(): without a status function GitHub adds an implicit success(), which is false once
    # backend is skipped (a web-only change), so the site would not ship. Unlike always(), a
    # cancelled release still stops here.
    if: >-
      !cancelled() &&
      needs.target.outputs.deploy_web == 'true' &&
      needs.release.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EDITION: muvloom
      PREFIX: PAID
    steps:
      - name: Require secrets
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          PAGES_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
        run: |
          missing=
          for name in PAGES_ENV PRIVATE_OVERLAY_SSH_KEY PAGES_API_TOKEN; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Secrets empty or missing:$missing"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - name: Write pages.env with the muvloom token file
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          PAGES_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
        run: |
          umask 077
          printf '%s\n' "$PAGES_API_TOKEN" | grep -Eqx '[A-Za-z0-9_-]+' ||
            { echo "::error::${PREFIX}_CLOUDFLARE_API_TOKEN has unexpected characters."; exit 1; }
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$PAGES_API_TOKEN" > "$RUNNER_TEMP/$PREFIX-cloudflare.env"
          {
            printf '%s\n' "$PAGES_ENV"
            echo "${PREFIX}_CLOUDFLARE_TOKEN_FILE=$RUNNER_TEMP/$PREFIX-cloudflare.env"
            echo "PAID_EXTRA_ASSETS_DIR=$GITHUB_WORKSPACE/private/pages-assets"
          } > "$RUNNER_TEMP/pages.env"
          echo "PAGES_ENV_FILE=$RUNNER_TEMP/pages.env" >> "$GITHUB_ENV"
      - name: Wait for the shared muvloom API and the enterprise API hostname
        if: needs.target.outputs.deploy_api == 'true'
        env:
          PUBLIC_SHA: ${{ needs.target.outputs.sha }}
          PRIVATE_SHA: ${{ needs.backend.outputs.private_sha }}
        run: |
          # shellcheck source=/dev/null
          . "$PAGES_ENV_FILE"
          # The enterprise API hostname must route to the shared runtime without crossing cookie sites.
          for api in "$PAID_BFF_BASE_URL" ${ENTERPRISE_BFF_BASE_URL:+"$ENTERPRISE_BFF_BASE_URL"}; do
            deadline=$(( $(date +%s) + 300 ))
            while :; do
              version=$(curl -fsS --max-time 10 "${api%/}/health" 2>/dev/null |
                sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)
              [ "$version" = "$PUBLIC_SHA+$PRIVATE_SHA" ] && break
              [ "$(date +%s)" -lt "$deadline" ] ||
                { echo "::error::$api/health reports '$version', expected $PUBLIC_SHA+$PRIVATE_SHA"; exit 1; }
              sleep 10
            done
          done
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Read the pinned overlay commit
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < private.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the private overlay at the backend's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ needs.backend.outputs.private_sha || steps.lock.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      - name: Require the muvloom site assets
        run: test -d private/pages-assets
      - run: pnpm install --frozen-lockfile
      # pages-release.sh 里的启动冒烟会 `playwright install --with-deps`，从 Azure apt 镜像下 21 MB 字体包；
      # 镜像慢时（run 42160603842 是 43 kB/s）单这一步 8 分钟，占本作业的四分之三。这里用与 Checks 相同的
      # deb 缓存先给 apt 预置，脚本本身不变。
      - uses: ./.github/actions/pages-browser
        with:
          smoke: 'false'
      - name: Release the muvloom Pages project
        env:
          PAGES_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/pages-muvloom-build
          APP_RELEASE: ${{ needs.release.outputs.version }}
        run: ./scripts/pages-release.sh "$EDITION"
      - name: Keep the downloaded Chromium packages for the cache
        run: find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -n {} "$RUNNER_TEMP/pages-browser-debs"/ \; 2>/dev/null || true
      - name: Verify the muvloom workspace in Chromium
        run: |
          # shellcheck source=/dev/null
          . "$PAGES_ENV_FILE"
          PAGES_SMOKE_OUTPUT_DIR="$RUNNER_TEMP/pages-muvloom-live" sh scripts/pages-browser-smoke.sh "$PAID_PUBLIC_ORIGIN"
      - name: Check the enterprise domain on the same project
        run: |
          # shellcheck source=/dev/null
          . "$PAGES_ENV_FILE"
          [ -n "${ENTERPRISE_PUBLIC_ORIGIN:-}" ] || { echo "No enterprise domain configured."; exit 0; }
          origin=${ENTERPRISE_PUBLIC_ORIGIN%/}
          host=${origin#https://}
          # The project's own custom-domain list decides whether the domain has moved here yet, so a
          # broken or stale enterprise site after the move can never pass as "not migrated".
          domains=$(
            # shellcheck source=/dev/null
            . "$PAID_CLOUDFLARE_TOKEN_FILE"
            curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$PAID_CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAID_PAGES_PROJECT" |
              jq -er '.result.domains[]'
          ) || { echo "::error::Could not read the custom domains of $PAID_PAGES_PROJECT."; exit 1; }
          if ! printf '%s\n' "$domains" | grep -Fqx "$host"; then
            # Check the alias after it has been attached to the shared project.
            echo "::warning::$host is not a custom domain of $PAID_PAGES_PROJECT yet; move it (docs/deploy/image-release.md)."
            exit 0
          fi
          expected=$(curl -fsS --max-time 10 "${PAID_PUBLIC_ORIGIN%/}/version.json")
          deadline=$(( $(date +%s) + 300 ))
          until [ "$(curl -fsS --max-time 10 "$origin/version.json" 2>/dev/null || true)" = "$expected" ]; do
            [ "$(date +%s)" -lt "$deadline" ] ||
              { echo "::error::$origin/version.json does not match ${PAID_PUBLIC_ORIGIN%/} after 300s."; exit 1; }
            sleep 10
          done
          curl -fsS --max-time 10 -o /dev/null -D "$RUNNER_TEMP/enterprise-headers" "$origin/"
          grep -Eiq '^x-robots-tag:.*noindex' "$RUNNER_TEMP/enterprise-headers" ||
            { echo "::error::$origin serves the muvloom project without its noindex header."; exit 1; }
          PAGES_SMOKE_OUTPUT_DIR="$RUNNER_TEMP/pages-muvloom-enterprise-live" sh scripts/pages-browser-smoke.sh "$origin"
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-pages-muvloom
          path: |
            ${{ runner.temp }}/pages-muvloom-build
            ${{ runner.temp }}/pages-muvloom-live
            ${{ runner.temp }}/pages-muvloom-enterprise-live
          retention-days: 7
      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP"/*-cloudflare.env "$RUNNER_TEMP/pages.env"

  admin-pages:
    name: Pages (admin)
    needs: [target, release, backend, pages-muvloom]
    if: >-
      !cancelled() &&
      needs.target.outputs.deploy_admin == 'true' &&
      needs.release.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.pages-muvloom.result == 'success' || needs.pages-muvloom.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require secrets
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          PRIVATE_OVERLAY_SSH_KEY: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          PAID_CLOUDFLARE_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
        run: |
          missing=
          for name in PAGES_ENV PRIVATE_OVERLAY_SSH_KEY PAID_CLOUDFLARE_API_TOKEN; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Secrets empty or missing:$missing"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - name: Write pages.env with the Admin token file
        env:
          PAGES_ENV: ${{ secrets.PAGES_ENV }}
          PAID_CLOUDFLARE_API_TOKEN: ${{ secrets.PAID_CLOUDFLARE_API_TOKEN }}
        run: |
          umask 077
          printf '%s\n' "$PAID_CLOUDFLARE_API_TOKEN" | grep -Eqx '[A-Za-z0-9_-]+' ||
            { echo "::error::PAID_CLOUDFLARE_API_TOKEN has unexpected characters."; exit 1; }
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$PAID_CLOUDFLARE_API_TOKEN" > "$RUNNER_TEMP/PAID-cloudflare.env"
          {
            printf '%s\n' "$PAGES_ENV"
            echo "ADMIN_CLOUDFLARE_TOKEN_FILE=$RUNNER_TEMP/PAID-cloudflare.env"
          } > "$RUNNER_TEMP/pages.env"
          echo "PAGES_ENV_FILE=$RUNNER_TEMP/pages.env" >> "$GITHUB_ENV"
      - name: Skip unless the Admin cutover is configured
        id: cutover
        run: |
          # shellcheck source=/dev/null
          . "$PAGES_ENV_FILE"
          if [ -z "${ADMIN_PAGES_PROJECT:-}" ]; then
            echo "::notice::Admin Pages cutover is not configured; skipping the Admin release."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for the Admin API
        if: steps.cutover.outputs.enabled == 'true' && needs.target.outputs.deploy_api == 'true'
        env:
          PUBLIC_SHA: ${{ needs.target.outputs.sha }}
          PRIVATE_SHA: ${{ needs.backend.outputs.private_sha }}
        run: |
          # shellcheck source=/dev/null
          . "$PAGES_ENV_FILE"
          if [ -z "${ADMIN_BFF_BASE_URL:-}" ]; then
            echo "::notice::Admin API base URL is not configured; skipping the Admin API check."
            exit 0
          fi
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            version=$(curl -fsS --max-time 10 "${ADMIN_BFF_BASE_URL%/}/health" 2>/dev/null |
              sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)
            [ "$version" = "$PUBLIC_SHA+$PRIVATE_SHA" ] && exit 0
            [ "$(date +%s)" -lt "$deadline" ] ||
              { echo "::error::$ADMIN_BFF_BASE_URL/health reports '${version}', expected $PUBLIC_SHA+$PRIVATE_SHA"; exit 1; }
            sleep 10
          done
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.cutover.outputs.enabled == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cutover.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.cutover.outputs.enabled == 'true'
      - name: Read the pinned overlay commit
        if: steps.cutover.outputs.enabled == 'true'
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < private.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the private overlay at the backend's commit
        if: steps.cutover.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PRIVATE_OVERLAY_REPO }}
          ref: ${{ needs.backend.outputs.private_sha || steps.lock.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          path: private
          persist-credentials: false
      - if: steps.cutover.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Release the muvloom Admin site
        if: steps.cutover.outputs.enabled == 'true'
        env:
          APP_RELEASE: ${{ needs.release.outputs.version }}
        run: ./scripts/pages-release.sh admin
      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP"/*-cloudflare.env "$RUNNER_TEMP/pages.env"
