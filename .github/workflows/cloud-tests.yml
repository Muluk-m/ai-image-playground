name: Cloud tests
on:
  pull_request:
    paths:
      - 'scripts/*cloud-test*'
      - 'scripts/cloud-vitest.mjs'
      - 'scripts/run-bun-tests-isolated.ts'
      - '.github/workflows/cloud-tests.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full public commit SHA to test
        required: true
        type: string
      target:
        description: Public workspace test target
        required: true
        type: choice
        options: [check, web, bff, db, verify]
      filter:
        description: Optional test file path or substring
        type: string
      overlay_sha:
        description: Optional exact private overlay revision for candidate verification
        type: string
      full_suite:
        description: Run the complete workspace suite
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aip_cloud_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aip_cloud_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.expected_sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify the requested revision before setup
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha }}
      - name: Check out candidate overlay
        if: inputs.overlay_sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Muluk-m/ai-image-playground-private
          ref: ${{ inputs.overlay_sha }}
          path: private
          ssh-key: ${{ secrets.PRIVATE_OVERLAY_SSH_KEY }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: python3 scripts/cloud-test.py prepare --sha "$EXPECTED_SHA"
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha }}
      - if: inputs.target != 'verify'
        run: |
          args=("$TARGET" --sha "$EXPECTED_SHA")
          if [ -n "$TEST_FILTER" ]; then args+=(--filter "$TEST_FILTER"); fi
          python3 scripts/cloud-test.py "${args[@]}"
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha }}
          TARGET: ${{ inputs.target || 'db' }}
          TEST_FILTER: ${{ inputs.filter }}
          CLOUD_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_cloud_test
      - name: Format and export candidate changes
        if: inputs.target == 'verify'
        run: |
          pnpm exec biome check --write .
          git diff --binary > "$RUNNER_TEMP/public-format.patch"
          if [ -d private/.git ]; then git -C private diff --binary > "$RUNNER_TEMP/private-format.patch"; fi
      - name: Upload formatting patches
        if: always() && inputs.target == 'verify'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patches
          path: ${{ runner.temp }}/*-format.patch
      - name: Verify candidate lint
        if: inputs.target == 'verify'
        run: pnpm lint
      - name: Verify candidate types
        if: always() && inputs.target == 'verify'
        run: pnpm typecheck
      - name: Build candidate
        if: always() && inputs.target == 'verify'
        run: pnpm build --force
      - name: Smoke real BFF HTTP process
        if: always() && inputs.target == 'verify' && inputs.overlay_sha == ''
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_cloud_test
          OPERATOR_CONFIG_FILE: /tmp/missing-smoke-operator.json
          PORT: '37377'
        run: |
          bun run apps/bff/src/db/migrate.ts
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.request
          proc = subprocess.Popen(['bun', '--no-env-file', 'apps/bff/src/index.ts'])
          try:
              for attempt in range(100):
                  if proc.poll() is not None:
                      raise RuntimeError('BFF exited before accepting HTTP')
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:37377/health', timeout=2) as res:
                          health = json.load(res)
                      assert health['ok'] is True, health
                      break
                  except OSError:
                      time.sleep(0.2)
              else:
                  raise RuntimeError('BFF health deadline exceeded')
              with urllib.request.urlopen('http://127.0.0.1:37377/api/channels', timeout=5) as res:
                  assert res.status == 200
                  json.load(res)
              print('SMOKE PASS: real BFF /health and /api/channels')
          finally:
              proc.terminate()
              proc.wait(timeout=20)
          PY
      - name: Exercise candidate billing and OAuth
        if: always() && inputs.target == 'verify' && inputs.overlay_sha != ''
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_cloud_test
          BUN_TEST_JOBS: 2
        run: pnpm --filter './private/apps/*' --workspace-concurrency=1 test
      - name: Complete workspace suite
        if: always() && inputs.target == 'verify' && inputs.full_suite
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aip_cloud_test
          BUN_TEST_JOBS: 4
          VITEST_MAX_WORKERS: 2
          NODE_OPTIONS: --no-experimental-webstorage
        run: pnpm test --concurrency=1 --env-mode=loose
