name: Canvas remote verification
on:
  push:
    branches: [fix/canvas-text-composer-references]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - run: pnpm exec biome check --write .
      - name: Capture remote formatting
        if: always()
        run: git diff --binary > "$RUNNER_TEMP/canvas-format.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canvas-format
          path: ${{ runner.temp }}/canvas-format.patch
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --dir apps/web test --run src/__tests__/features/canvas/lib/nodeCanvasSelection.test.ts
