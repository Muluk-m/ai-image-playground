name: Verify production browser startup
description: Cold-start the production build in Chromium before it can be published.
inputs:
  target:
    description: Built dist directory or deployed origin
    default: apps/web/dist
  live:
    description: Check a deployed origin instead of a local build
    default: 'false'
  label:
    description: Artifact name for screenshots and failure evidence
    default: pages-startup
  test-runner:
    description: Exercise the smoke runner's failure cases
    default: 'false'
runs:
  using: composite
  steps:
    # `playwright install --with-deps` apt-installs a handful of font packages the hosted image
    # lacks (~21 MB). The Azure apt mirror sometimes serves them at ~70 kB/s: 4 minutes in the
    # Checks job and 14 in the rollout job of run 39799977649. Keep the downloaded .deb files in
    # the Actions cache and seed apt with them, so apt installs the same packages without fetching
    # them. apt does NOT re-hash a file it finds in /var/cache/apt/archives: a matching name and
    # size is enough (pkgAcqArchive in apt-pkg/acquire-item.cc). So before seeding, every cached
    # file must match the SHA256 that the freshly updated, signed apt index lists for that exact
    # package and version; anything else is deleted and apt downloads it again. A cache that falls
    # behind the mirror only costs the old download time. The smoke script is unchanged.
    # ImageOS / ImageVersion are runner environment variables, not part of the `env` context.
    - name: Name the package cache after the runner image
      id: debs-key
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "prefix=pages-browser-debs-${RUNNER_ARCH}-${ImageOS:-unknown}-pw1.58.2-" >> "$GITHUB_OUTPUT"
        echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - name: Restore cached Chromium system packages
      if: runner.os == 'Linux'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/pages-browser-debs
        key: ${{ steps.debs-key.outputs.prefix }}${{ steps.debs-key.outputs.image }}
        restore-keys: |
          ${{ steps.debs-key.outputs.prefix }}
    - name: Seed apt with the cached packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        DEBS: ${{ runner.temp }}/pages-browser-debs
      run: |
        mkdir -p "$DEBS"
        echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-keep-debs >/dev/null
        compgen -G "$DEBS/*.deb" >/dev/null || exit 0
        # The index is what vouches for a file, so refresh it (signature-checked) first.
        sudo apt-get update -qq
        seeded=0 dropped=0
        for deb in "$DEBS"/*.deb; do
          pkg=$(dpkg-deb -f "$deb" Package 2>/dev/null) || pkg=
          ver=$(dpkg-deb -f "$deb" Version 2>/dev/null) || ver=
          arch=$(dpkg-deb -f "$deb" Architecture 2>/dev/null) || arch=
          got=$(sha256sum "$deb" | cut -d' ' -f1)
          # Captured first: with pipefail, `grep -q` closing the pipe early would fail the match.
          listed=
          if [ -n "$pkg" ] && [ -n "$ver" ]; then
            listed=$(apt-cache show "$pkg=$ver" "$pkg:$arch=$ver" 2>/dev/null || true)
          fi
          if [ -n "$listed" ] && grep -qx "SHA256: $got" <<<"$listed"; then
            sudo cp "$deb" /var/cache/apt/archives/
            seeded=$((seeded + 1))
          else
            echo "Dropping $(basename "$deb"): not in the apt index with this SHA256."
            rm -f "$deb"
            dropped=$((dropped + 1))
          fi
        done
        echo "Seeded $seeded verified cached packages; dropped $dropped."
    - name: Check browser regression cases
      if: inputs.test-runner == 'true'
      shell: bash
      run: sh scripts/pages-browser-smoke.sh --test
    - name: Verify startup
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        LIVE: ${{ inputs.live }}
        PAGES_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/${{ inputs.label }}
      run: |
        if [ "$LIVE" = true ]; then
          sh scripts/pages-browser-smoke.sh "$TARGET"
        else
          sh scripts/pages-browser-smoke.sh --dist "$TARGET"
        fi
    - name: Keep the downloaded packages for the cache
      if: runner.os == 'Linux'
      shell: bash
      env:
        DEBS: ${{ runner.temp }}/pages-browser-debs
      run: |
        find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -n {} "$DEBS"/ \; 2>/dev/null || true
    - name: Save browser evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.label }}
        path: ${{ runner.temp }}/${{ inputs.label }}
        retention-days: 7
