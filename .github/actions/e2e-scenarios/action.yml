name: Browser scenarios
description: Build the web app, start the local stack (PostgreSQL, BFF, mock upstream) and run the workbench scenarios in Chromium. Needs a PostgreSQL service and TEST_DATABASE_URL on the job.
inputs:
  label:
    description: Artifact name for logs, screenshots and traces
    default: browser-scenarios
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    # 前端按同源 BFF 构建；这里的地址只是占位；套件会在 dist 的副本里按实际端口改写 runtime-config.json。
    - run: pnpm --dir apps/web build:static-host
      shell: bash
      env:
        BFF_ENABLED: 'true'
        BFF_BASE_URL: http://127.0.0.1:37377
    # 只预热 Chromium 的系统包缓存；浏览器由 e2e-scenarios.sh 自己装并运行。
    - uses: ./.github/actions/pages-browser
      with:
        smoke: 'false'
    - name: Run the scenarios
      shell: bash
      env:
        E2E_OUT_DIR: ${{ runner.temp }}/${{ inputs.label }}
      run: pnpm e2e:scenarios
    - name: Save logs, screenshots and traces
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.label }}
        path: ${{ runner.temp }}/${{ inputs.label }}
        if-no-files-found: ignore
        retention-days: 7
